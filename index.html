<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>반가옹 세계사 노트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#f4f6f3;--panel:#ffffff;--ink:#1a2420;--mute:#5d6b64;--line:#d7ded9;--side:#163b2e;--side-on:#1f5240;--side-ink:#d9e6df;--side-dim:#8fb7a6;--amber:#d97706;--amber-bg:#fde68a;--amber-ink:#78350f;--ok:#15803d;--ok-bg:#dcfce7;--bad:#b91c1c;--bad-bg:#fee2e2;--soft:#e6efea;--note:#8b3a3a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121816;--panel:#1a2320;--ink:#e6ece8;--mute:#98a8a0;--line:#2b3833;--side:#0f2a20;--side-on:#1b4a38;--side-ink:#cfe0d6;--side-dim:#7fae98;--amber:#f59e0b;--amber-bg:#4a3608;--amber-ink:#fde68a;--ok:#4ade80;--ok-bg:#14361f;--bad:#f87171;--bad-bg:#3f1515;--soft:#1f3a2f;--note:#e8a0a0}}
:root[data-theme="dark"]{--bg:#121816;--panel:#1a2320;--ink:#e6ece8;--mute:#98a8a0;--line:#2b3833;--side:#0f2a20;--side-on:#1b4a38;--side-ink:#cfe0d6;--side-dim:#7fae98;--amber:#f59e0b;--amber-bg:#4a3608;--amber-ink:#fde68a;--ok:#4ade80;--ok-bg:#14361f;--bad:#f87171;--bad-bg:#3f1515;--soft:#1f3a2f;--note:#e8a0a0}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR",system-ui,sans-serif;font-size:14px;line-height:1.55;min-height:100vh}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:13px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:8px 12px}
button.pri{background:var(--side);color:#fff;border-color:var(--side)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.app{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:18px 12px;display:flex;flex-direction:column;gap:4px;font-size:12.5px;position:sticky;top:0;height:100vh;overflow-y:auto}
.side h1{color:#fff;font-size:15px;font-weight:600;margin:0 4px 10px}
.side .ch{display:flex;justify-content:space-between;gap:6px;padding:6px 8px;border-radius:6px;cursor:pointer;border:0;background:transparent;color:inherit;text-align:left;font-size:12.5px;width:100%}
.side .ch:hover{background:rgba(255,255,255,.06)}
.side .ch.on{background:var(--side-on);color:#fff}
.side .ch em{font-style:normal;color:var(--side-dim);font-size:11px;flex:none}
.side .ch em.done{color:#fff}
.side .sep{border-top:1px solid rgba(255,255,255,.12);margin:8px 4px}
.side .tool{color:var(--side-dim);font-size:11.5px;padding:6px 8px}
.main{padding:20px 24px 60px;display:flex;flex-direction:column;gap:16px;max-width:900px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
button.kpi{text-align:left;cursor:pointer}button.kpi:hover{border-color:var(--side)}
.kpi small{display:block;font-size:11px;color:var(--mute);letter-spacing:.04em}
.kpi b{font-size:22px;font-weight:500}
.kpi b i{font-style:normal;font-size:12px;color:var(--mute);margin-left:3px}
.strip{display:flex;gap:4px;overflow-x:auto;padding:16px 0 6px;margin-top:6px;position:relative}
.strip:before{content:"";position:absolute;left:0;right:0;top:8px;border-top:2px solid var(--side)}
.strip button{flex:none;position:relative;font-size:11px;padding:2px 6px;border:0;background:transparent;color:var(--mute)}
.strip button:before{content:"";position:absolute;top:-12px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--line)}
.strip button.some:before{background:var(--side-dim)}
.strip button.done:before{background:var(--side)}
.strip button.cur{color:var(--amber);font-weight:500}
.strip button.cur:before{background:var(--amber);box-shadow:0 0 0 4px var(--amber-bg)}
.qbox{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:11.5px;color:var(--mute);margin-bottom:10px}
.meta .pill{background:var(--amber-bg);color:var(--amber-ink);padding:1px 7px;border-radius:3px;font-family:"IBM Plex Sans KR",sans-serif}
.meta button{padding:2px 8px;font-size:11.5px}
.q{font-size:16px;line-height:1.7;overflow-wrap:anywhere}
.q .ctx{display:block;font-size:13px;color:var(--mute);line-height:1.5;margin-bottom:6px;padding-left:8px;border-left:2px solid var(--line)}
.q .ctx b{font-weight:500}
.q .sec{display:block;font-size:12px;color:var(--mute);margin-bottom:4px}
.blank{display:inline-block;min-width:70px;border-bottom:2px solid var(--amber);margin:0 3px;vertical-align:bottom;text-align:center;color:var(--amber-ink);background:var(--amber-bg);border-radius:3px 3px 0 0;padding:0 6px;font-weight:500}
.note{color:var(--note);font-size:.92em}
.badge{display:inline-block;background:var(--amber-bg);color:var(--amber-ink);font-size:10.5px;padding:0 5px;border-radius:3px;vertical-align:2px;margin:0 2px}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
.choices button{text-align:left;padding:10px 12px;font-size:14px;border-radius:6px;background:var(--bg)}
.choices button.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.choices button.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.after{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.after .res{font-weight:500;margin-right:auto}
.ai{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.ai h3{margin:0;font-size:11px;letter-spacing:.06em;color:var(--side);font-weight:600}
.ai .log{display:flex;flex-direction:column;gap:8px;max-height:360px;overflow-y:auto}
.ai .msg{padding:8px 10px;border-radius:6px;font-size:13.5px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.ai .msg.u{background:var(--soft);align-self:flex-end;max-width:85%}
.ai .msg.a{background:var(--bg);border:1px solid var(--line)}
.ai form{display:flex;gap:8px}
.ai input{flex:1;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.ai .hint{font-size:11.5px;color:var(--mute)}
.empty{color:var(--mute);padding:30px 0;text-align:center}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);max-width:min(960px,94vw);width:100%;padding:0;max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dlg{display:grid;grid-template-columns:1fr 1fr;gap:0;max-height:92vh}
.dlg>div{padding:16px 18px;overflow-y:auto;max-height:92vh}
.dlg .txt{font-size:13.5px;line-height:1.65;border-right:1px solid var(--line)}
.dlg .txt h4{margin:14px 0 6px;font-size:13px}
.dlg .txt p{margin:0 0 4px}
.dlg .txt img{display:block;max-width:100%;border:1px solid var(--line);border-radius:4px;margin:6px 0 2px}
.dlg .txt .cap{font-size:11.5px;color:var(--mute);margin-bottom:8px}
.dlg .txt .ind{padding-left:1.2em}
.dlg .txt table{border-collapse:collapse;font-size:12.5px;margin:6px 0}
.dlg .txt td,.dlg .txt th{border:1px solid var(--line);padding:3px 6px;text-align:left}
.dlg .scan img{width:100%;border:1px solid var(--line)}
.dlg .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px;color:var(--mute)}
@media(max-width:760px){.app{grid-template-columns:minmax(0,1fr);align-content:start}.side{position:static;height:auto;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;padding:10px;align-items:center}.side h1{display:none}.side .ch{width:auto;flex:none;white-space:nowrap;gap:4px}.side .sep{display:none}.side .tool{display:none}.main{padding:14px}.kpis{gap:6px}.kpi{padding:8px 10px}.kpi small{font-size:10px}.kpi b{font-size:18px}.choices{grid-template-columns:1fr}.dlg{grid-template-columns:1fr}.dlg .txt{border-right:0;border-bottom:1px solid var(--line)}}
@media(prefers-reduced-motion:no-preference){.choices button{transition:background .15s}}
</style></head><body>

<div class="app">
  <nav class="side" id="side"><h1>반가옹 세계사 노트</h1></nav>
  <main class="main">
    <div class="kpis">
      <div class="kpi"><small>오늘 푼 문제</small><b class="mono" id="kToday">0</b></div>
      <div class="kpi"><small>정답률 (전체)</small><b class="mono" id="kAcc">—<i>%</i></b></div>
      <button class="kpi" id="kWrongBtn" title="틀린 문제만 다시 풀기"><small>오답 노트 · 누르면 다시 풀기</small><b class="mono" id="kWrong">0<i>개</i></b></button>
    </div>
    <div class="strip mono" id="strip"></div>
    <div class="qbox" id="qbox"><div class="empty">왼쪽에서 챕터를 고르면 문제가 시작됩니다.</div></div>
    <section class="ai" id="ai">
      <h3>교재에 질문 · 이 책 범위 안에서만 답합니다</h3>
      <div class="log" id="log"></div>
      <form id="askForm"><input id="askIn" placeholder="예: 플롱비에르 협정에서 프랑스가 받기로 한 땅은?" autocomplete="off"><button class="pri" id="askBtn">질문</button></form>
      <div class="hint" id="aiHint">AI 연결 확인 중…</div>
    </section>
  </main>
</div>

<dialog id="dlg"><div class="dlg"><div class="txt" id="dlgTxt"></div><div class="scan" id="dlgScan"></div></div></dialog>

역, 지명 은허·타이산·](figures/fig-002-5.jpg)\n*그림 002-5 — 지도 · 상·주의 세력 범위 — 범례: 상의 세력 범위(붉은 테두리), 주의 세력 범위(노란색). 황허·창장(양쯔강) 유역, 지명 은허·타이산·호경·하오징·낙읍(뤄양) 표시. 하단 라벨 상자 '주의 천도(기원전 770)'*\n\n- **[하]** – 기록상 최초의 왕조\n- **[상]** – B.C 1600년경, **은허 중심**으로 발달, 순장 풍습\n  - **갑골문(신권정치)**\n- **[주]** – B.C 1100년경, '**호경**' 도읍\n  - **봉건제** – 직할지는 왕이 직접 / 나머지는 제후에게\n    - **종법제(친족제도)** + **천명사상(덕치주의)** [필기: ㄴ 혈연관계]\n\n> [필기] 왼쪽 여백에 인쇄된 MEMO 칸 — 비어 있음\n\n<!-- leaf-003 -->\n### p.11\n\n#### 5. 지중해 연안 국가들\n\n- **[히타이트]** – 철제 무기, 전차(아나톨리아 지역)\n  - **서아시아에 철기 문화 전파**\n- **[페니키아]** – **해상 무역 주도**\n  - 식민 도시 건설(**카르타고**)\n  - **표음문자**(알파벳의 기원)\n- **[헤브라이]** – 이스라엘 왕국 – 솔로몬왕(전성기)\n  - 이스라엘 / 유대 분열\n  - **유대교 창시**(크리스트교, 이슬람교에 영향)\n\n![지도 · 지중해 연안 국가들 — 범례: 페니키아인의 활동지(노랑), 이스라엘 왕국(흰색), 히타이트 왕국(자주 테두리), 에게 문명의 발상지(청](figures/fig-003-1.jpg)\n*그림 003-1 — 지도 · 지중해 연안 국가들 — 범례: 페니키아인의 활동지(노랑), 이스라엘 왕국(흰색), 히타이트 왕국(자주 테두리), 에게 문명의 발상지(청록). 아나톨리아, 이집트, 나일강, 홍해, 그리스, 미케네, 트로이, 크노소스 표기. 학생이 붉은 볼펜으로 흑해·에게해·지중해·크레타섬·가나안을 덧써 넣음 [필기: 흑해, 에게해, 지중해, 크레타섬, 가나안]*\n\n**◧ 에게 문명_유럽 문명의 기초를 세우다**\n\n> 지중해의 에게해 지역과 그리스 본토에서는 서아시아 지역 문명의 영향을 받아 청동기 문명인 에게 문명이 발달했어. 기원전 20세기경부터 에게해의 중심지인 **크레타섬**에서는 강력한 왕권과 해상 무역을 바탕으로 **청동기** 문명이 번영했어. 2026학년도 6월 평가원 모의고사에 크레타섬이 나온 적이 있었던 만큼, 그 위치와 크레타 문명에 대해서도 확인해보는 것이 좋아. **크레타 문명**은 크노소스 궁전을 비롯한 여러 유물을 남겼어. 기원전 14세기에는 그리스 본토에서 남하해 온 **미케네인이 에게해를 장악**하며 미케네 문명을 발달시켰어. 미케네 문명은 철기를 사용하는 도리스인의 침입을 받아 멸망하였어.\n\n> [필기] 위 지문 안, 앞줄의 '미케네인'에서 뒷줄의 '미케네 문명'으로 붉은 볼펜 화살표를 그어 연결(글자 없이 선과 X 표시만)\n\n![사진 · ▲ 크노소스 궁전 — 붉은 기둥이 늘어선 복원된 궁전 유적과 앞쪽의 석재 구조물](figures/fig-003-2.jpg)\n*그림 003-2 — 사진 · ▲ 크노소스 궁전 — 붉은 기둥이 늘어선 복원된 궁전 유적과 앞쪽의 석재 구조물*\n\n> [필기] 오른쪽 여백에 인쇄된 MEMO 칸 — 비어 있음\n\n<!-- leaf-004 -->\n### p.12\n\n<!-- 상단 러닝 헤더: CHAPTER 01 문명사 -->\n\n#### 6. 평가옹의 선택 – 평가원의 최신 기출 문항 Pick!\n\n**01** (가) 문명에 대한 설명으로 옳은 것은?  〈2026학년도 수능〉\n\n![삽화 · 교사가 화면(TV 보드)을 가리키며 설명하는 그림 — 화면에는 이집트식 항아리 모양 유물과 그 표면에 새겨진 상형 문자를 확대한 부분이](figures/fig-004-1.jpg)\n*그림 004-1 — 삽화 · 교사가 화면(TV 보드)을 가리키며 설명하는 그림 — 화면에는 이집트식 항아리 모양 유물과 그 표면에 새겨진 상형 문자를 확대한 부분이 나란히 제시됨*\n\n> 이 유물은 나일강 유역에서 발달한 [ (가) ]의 라훈 지역에서 발견된 것입니다. 유물에는 '공주여, 만물을 낳는 이 땅에서 나오는 시원한 물을 받으소서. 그대가 그것을 통해 살고 그것을 통해 되살아나기를 기원합니다.'라는 내용이 상형 문자로 새겨져 있습니다. [ (가) ]의 사람들은 영혼 불멸과 사후 세계를 믿어 이러한 유물을 매장하였습니다.\n\n- ① 피라미드를 축조하였다. [필기: ①에 체크(✓) 표시]\n- ② 길가메시 서사시를 남겼다.\n- ③ 올림피아 제전을 개최하였다.\n- ④ 갑골에 점복의 내용을 기록하였다.\n- ⑤ 하라파 등 계획도시를 건설하였다.\n\n**02.** (가) 문명에 대한 설명으로 옳은 것은?  〈2026학년도 9월〉\n\n![삽화 · 교사가 화면(TV 보드)을 가리키며 설명하는 그림 — 화면에는 점토판 사진에 지시선으로 '유프라테스강', '운하', '지구라트', '정](figures/fig-004-2.jpg)\n*그림 004-2 — 삽화 · 교사가 화면(TV 보드)을 가리키며 설명하는 그림 — 화면에는 점토판 사진에 지시선으로 '유프라테스강', '운하', '지구라트', '정원'이 표시되어 있음*\n\n> 이것은 티그리스강과 유프라테스강 유역에서 발달한 [ (가) ]의 도시 니푸르의 내부 구조가 새겨진 점토판입니다. 이 점토판에는 강과 주요 시설물이 쐐기 문자로 표기되어 있습니다.\n\n- ① 사자의 서를 제작하였다.\n- ② 올림피아 제전을 개최하였다.\n- ③ 태음력과 60진법을 사용하였다.\n- ④ 점을 친 내용을 갑골에 기록하였다.\n- ⑤ 하라파와 모헨조다로를 건설하였다.\n\n> [필기] 왼쪽 여백에 인쇄된 MEMO 칸 — 비어 있음\n\n<!-- leaf-005 -->\n### (쪽번호 없음)\n\n**MEMO**\n\n(빈 쪽 — 인쇄된 MEMO 제목과 점선 괘선만 있고 필기 없음)\n\n<!-- leaf-006 -->\n### p.22\n\n## CHAPTER 01 고대 지중해 세계(그리스, 알렉산드로스, 로마)\n\n<!-- 헤더 원문 그대로: 원 안에 'CHAPTER 01', 그 아래 제목 -->\n\n#### 1. 그리스 세계\n\n![도표 · 아테네 정치 변천 흐름도 — 왼쪽 '왕정' 상자에서 아래 '귀족정'으로 이어지고, 오른쪽으로 뻗는 가로 화살표 띠(B.C 6c) 위에 ](figures/fig-006-1.jpg)\n*그림 006-1 — 도표 · 아테네 정치 변천 흐름도 — 왼쪽 '왕정' 상자에서 아래 '귀족정'으로 이어지고, 오른쪽으로 뻗는 가로 화살표 띠(B.C 6c) 위에 [① 솔론] → 페이시스트라토스 → [② 클레이스테네스] 상자가 차례로 놓이며 각 상자 아래에 설명 불릿이 달림. 화살표 띠 위에 학생이 〈아테네〉라고 씀*\n\n- **왕정**\n  - [필기: 〈아테네〉 — 가로 화살표 띠 위에 표기]\n  - ↓\n- **귀족정** — (B.C 6c 화살표 띠 시작)\n  - 평민: 중장보병\n    - → 정치적 권리 요구\n    - → 귀족 vs 평민\n- **[① 솔론]** [필기: 빈칸에 '솔론'을 써넣고 '솔'에 동그라미]\n  - 조정자(귀족vs평민)\n  - **금권정**\n    - 재산에 따라 **참정권 차등 분배**\n- **페이시스트라토스** [필기: '페'에 동그라미 표시]\n  - 참주정(독재)\n- **[② 클레이스테네스]** [필기: 빈칸에 '클레이스테네스'를 써넣고 '클'에 동그라미]\n  - 부족제 개편 (혈연 중심 → 행정적)\n  - **500인 평의회**\n  - **도편 추방제**\n\n> [필기] 왼쪽 아래 여백에 연필로 쓴 메모 —\n> 그리스 · 스파르타\n> - 군국주의 (군사중심)\n> - 헤일로타이, 페리오이코이\n> - 아고게 : 집단 교육 시스템.\n> - 펠로폰네소스 동맹 주도\n\n**[그리스의 문화]: 인간 중심적, 합리적**\n\n| 구분 | 인물·항목 | 내용 |\n| --- | --- | --- |\n| 철  실시하였다.\n- ⑤ 클레이스테네스가 도편 추방제를 마련하였다.\n\n> [필기] 선택지 오른쪽 여백에 초록색으로 — ↳ 그리스·페르시아 (아래로 화살표 ↓)\n\n> [필기] 왼쪽 여백에 인쇄된 MEMO 칸 — 비어 있음\n\n<!-- leaf-011 -->\n### (쪽번호 없음)\n\n**MEMO**\n\n(줄만 그어진 빈 메모 쪽 — 인쇄된 내용 없음. 뒷장 내용이 비쳐 보이나 판독 대상 아님.)\n\n---\n\n<!-- leaf-012 -->\n### p.32\n\n## CHAPTER 02 중세 유럽의 형성(프랑크 왕국, 봉건제, 비잔티움 제국, 크리스트교)\n\n> [필기] ※ 문제의 발문에서 (가)(나) 왕조에서 있었던 일 - ? 이런 왕조에 limit 걸고 판단해야된다.\n\n#### 1. 프랑크 왕국\n\n- **5c**\n  - 게르만족 이동 [필기: 야만족 뜻]\n    - → **서로마 멸망** [필기: by 오도아케르(용병대장)]\n    - **반달 왕국** [필기: 세움]\n      - 카르타고 지역\n      - 반달족\n- **8c**\n  - 짧은 이동 거리\n  - 갈리아 지방(로마 유산)\n    - → **프랑크 왕국**\n\n![지도 · 「프랑크 왕국의 발전」 — 범례: 피핀이 기증한 땅(754, 보라), 로마 교황령(하늘색), 카롤루스 대제 즉위시의 영토(768, 분홍](figures/fig-012-1.jpg)\n*그림 012-1 — 지도 · 「프랑크 왕국의 발전」 — 범례: 피핀이 기증한 땅(754, 보라), 로마 교황령(하늘색), 카롤루스 대제 즉위시의 영토(768, 분홍), 카롤루스 대제 때의 획득지(노랑), 카롤루스 대제의 세력 범위(굵은 테두리), 카롤루스 대제의 원정 방향(빨간 화살표). 표기 지명: 앵글로색슨 왕국, 런던, 슬라브 족, 메르센, 아헨, 파리, 베르됭, 투르, 푸아티에, 대서양, 아스투리아스 왕국, 후우마이야 왕조, 바르셀로나(추정), 베네치아, 라벤나, 로마, 베네벤토 공국, 비잔티움 제국, 지중해, 북해. 지도 가운데 \"카롤루스 대제의 황제 대관(800년)\" 말풍선 표시.*\n\n**메로베우스 왕조**\n\n- [① **클로비스** ]\n  - 왕조 개창 [필기: (판독불확실)]\n  - 아타나시우스파 개종 [필기: (판독불확실)]\n    - (로마 카톨릭)\n    - [필기: 아타나 vs 아리우스]\n- [② **카롤루스 마르텔** ] [필기: 피핀 2세]\n  - 궁재\n  - 이슬람 세력 격퇴 [필기: → 위드(?)대공의 구원요청 (판독불확실) / 압둘 라흐만]\n    - vs [③ **우마이야** ] 왕조\n    - (투르·푸아티에 전투) [필기: 732]\n\n> [필기] 지중해 연안 약도를 손으로 그려 넣고, 이베리아 반도 부근에 화살표와 빗금 표시.\n\n**카롤루스 왕조**\n\n- [④ **피핀** ] [필기: 3세 / 롬바르드 지역 뺏었음]\n  - 마르텔의 아들 [필기: 힐데리히 3세 X]\n  - 궁재 → **왕조 개창** [필기: 자카리아스]\n  - **롬바르디아 지방 기증**\n    - 교황의 지지 [필기: → 라벤나]\n    - 교황령의 시초\n- [⑤ **카롤루스 대제** ] [필기: 롬바르드 멸망시킴 / 피핀]\n  - 피핀의 아들\n  - 옛 서로마 영토 회복\n  - 정복지에 교회를 세움\n  - **서로마 황제로 대관** [필기: (800)]\n    - 교황 [⑥ **레오 3세** ] [필기: 아우구스투스]\n  - **카롤루스 문예 부흥** [필기: (르네상스)]\n    - 아헨에 궁정학교\n    - [필기: 수도 (투르네 → 파리 → 아헨) — 투르네: 클로비스, 아헨: 카롤루스 대제]\n\n#### 2. 비잔티움 제국\n\n> [필기] (5C ~ 15C) → 1453\n\n- 로마 → 서로마 → 프랑크 왕국\n- 로마 → 동로마 → 비잔티움 제국\n  - **황제 교황주의** [필기: 황제가 교리 지배]\n  - 콘스탄티노폴리스 번영\n- **6c**\n  - [⑩ **유스티 n*그림 020-1 — 사진 · (흑백 삽화) 액자에 걸린 중세 세밀화(태피스트리풍 그림)를 오른쪽에 선 남성 강사가 손으로 가리키며 설명하는 장면. 그림 속에는 왕관을 쓴 인물, 갑옷 입은 기사들, 말과 사냥개, 활을 든 인물 등이 빽빽하게 그려져 있음(잔 다르크가 왕세자 샤를을 만나는 장면을 표현한 그림).*\n\n- ① 앙리 4세가 낭트 칙령을 반포하였습니다. [필기: X]\n- ② 교황과 황제가 보름스 협약을 맺었습니다. [필기: X]\n- ③ 로마와 아비뇽에서 교황이 각각 선출되었습니다. [필기: X]\n- ④ 라틴 제국이 콘스탄티노폴리스에서 수립되었습니다. [필기: O, 번호 위에 ∨ 체크 — 학생이 고른 답]\n- ⑤ 교황 우르바누스 2세가 클레르몽 공의회를 개최하였습니다.\n\n**02** 다음 자료에 나타난 전쟁에 대한 탐구 활동으로 가장 적절한 것은?  〈2023학년도 수능〉 [필기: '적절한'에 동그라미]\n\n> 이슬람력 588년 샤반월 22일, 술탄의 사절단이 평화 협정을 체결하기 위해 잉글랜드왕의 처소를 방문하였다. 병원 기사단과 성전 기사단 및 모든 프랑크인 지휘관들이 평화 협정에 동의하였다. 다음날 아침, 왕의 사절단은 술탄의 처소로 가서 정해진 원칙에 따라 협정을 체결하였다. 술탄은 이로써 예루살렘 순례길이 열렸음을 공표하였다. 하지만 그는 진정으로 협정을 원한 것은 아니었다. 이슬람 군대가 지쳐서 프랑크인들과 벌여온 싸움을 계속하는 것에 불복하려는 조짐이 있었기에, 전략상 협정 체결이 필요하다고 생각하였다.\n>\n> [필기: 12c] [필기: 밑줄·동그라미 강조 — 잉글랜드왕의 처소, 술탄, 협정을 체결, 예루살렘 순례길이 열렸음, 이슬람 군대가 지쳐서, 협정 체결]\n\n- ① 파르티아의 멸망 요인을 분석한다. [필기: X]\n- ② 농촌에서 콜로나투스가 확산된 원인을 파악한다. [필기: X]\n- ③ 영국에서 노르만 왕조가 성립된 이유를 찾아본다. [필기: X]\n- ④ 베르됭 조약과 메르센 조약의 체결 과정을 알아본다. [필기: X]\n- ⑤ 지중해 지역의 원거리 무역과 상업 발전의 배경을 조사한다. [필기: ∨ 체크 — 학생이 고른 답]\n\n(쪽 하단) 44 반가옹 세계사 개념 완성\n\n<!-- leaf-021 -->\n### p.49\n\n#### 1. 르네상스\n\n**[개념 도식]**\n\n- **십자군 전쟁의 영향**\n  - 원거리 교역 확대\n    - 이탈리아 도시 국가 성장\n  - 이슬람·비잔티움 문화 유입\n- **르네상스**\n  - 의미: 부활, 재생, 문예부흥\n  - 고대 그리스·로마 문화 부흥\n  - **인간 중심주의 경향**\n- **이탈리아 르네상스(14c 무렵)**\n  - 예술 중심, 탐미적\n- **알프스 이북 르네상스(16c 무렵)**\n  - 사회 비판, 현실적\n\n##### ① 이탈리아 르네상스\n\n| 구분 | 인물/양식 | 내용 |\n| --- | --- | --- |\n| 인문<br>주의자 | 페트라르카 [필기: 최초] | · 인간의 감정을 솔직하게 표현한 서정시 |\n| | 보카치오 | · 〈데카메론〉에서 사회의 타락상과 인간의 위선 풍자 |\n| | [① **마키아벨리**] [필기] [필기: (16C)] | · 〈군주론〉에서 이탈리아 통일을 위한 강력한 군주의 필요성 주장 |\n| 미술 | | · 레오나르도 다빈치〈모나리자〉, 미켈란젤로〈다비드상〉, 라파엘로〈아테네 학당〉 등 |\n| 건축 | | · 르네상스 양식: 그리스의 **열주**와 로마의 **돔** 양식 계승, **성 베드로 성당** [필기: (14~15C)] |\n\n##### ② 알프스 이북 르네상스\n\n| 구분 | 인물/양식 | 내용 |\n| --- | --- | --- |\n| 인문<br>주의자 | [② **토머스 모어**] [필기] | · 〈유토피아〉에서 부조리한 영국의 현실 사회 비판 [필기: \"양들이 사람을 잡아먹었다\"]<br>· **1차 인클로저 운동** 비판 [필기: → 모직물산업↑ : 양 목장↑] [필기(빨강): 16C] |\n| | [③ **에라스뮈스**] [필기] | · 〈우신예찬〉에서 교회의 허식과 성직자의 타락상을 풍자 [필기: → 종교개혁에 영향] |\n| 미술 | | · 반에이크 형제의 유화 기법 · 브뤼헐이 서민 생활 모습 표현 |\n| 건축 | | · 라틴어 대신 **모국어**로 쓴 국민 문학 발달<br>· 〈돈키호테〉: 에스파냐 세르반테스, 몰락하는 봉건 기사 풍자<br>· 영국의 셰익스피어 〈햄릿〉, 〈로미오와 줄리엣〉 등 |\n\n> [필기] 위 표의 '건축' 행 라벨은 인쇄 원문 그대로임(내용은 문학).\n\n##### ③ 근대 과학 기술의 발달\n\n- 중국에서 전래된 **화약**: 봉건 기사의 몰락 촉진\n- 중국에서 전래된 **나침반**: 원거리 항해에 이용되면서 유럽 세계의 팽창에 기여\n- **구텐베르크가 고안한 활판 인쇄술(1455)**은 제지술과 함께 유럽에 새로운 지식과 사상 전파에 이바지\n  - **르네상스와 종교개혁 확산에 기여**\n\n<!-- leaf-022 -->\n### p.50\n\n## CHAPTER 04 유럽 세계의 변화(르네상스, 종교개혁)\n\n#### 2. 종교개혁\n\n**[개념 도식]**\n\n- **로마 가톨릭(구교)** [필기: · 프랑스 / · 에스파냐]\n  - (대응, 점선 화살표 →)\n    - [⑨ **트리엔트**] [필기] 공의회(1545~63)\n      - 교황의 권위와 교리 재확인\n      - 종교 재판 강화, 도서 검열제 도입\n      - **라틴어 성경(불가타)만을 정통으로 인정**\n    - [⑩ **예수회**] [필기] 설립\n      - 에스파냐 **로욜라** 창설\n        **(1534년 설립, 1540년 공인)**\n      - 아시아, 아프리카, 아메리카에서 선교 활동 전개\n  - **vs**\n    - 교회의 부패와 타락\n    - 알프스 이북 인문주의자들의 교회 비판\n\n![지도 · ▲ 신교의 확산 — 16세기 유럽 종교 분포 지도. 범례: 초록 화살표=칼뱅파의 전파, 주황 화살표=루터파의 전파, 자주색 면=프로테스](figures/fig-022-1.jpg)\n*그림 022-1 — 지도 · ▲ 신교의 확산 — 16세기 유럽 종교 분포 지도. 범례: 초록 화살표=칼뱅파의 전파, 주황 화살표=루터파의 전파, 자주색 면=프로테스탄트, 청회색 면=로마 가톨릭교, 주황 점=영국 국교회. 표기 지명: 런던, 파리, 제네바, 비텐베르크, 아우크스부르크, 트리엔트, 로마, 북해, 대서양. 초록 글상자로 장로파·청교도(브리튼 제도), 고이센(네덜란드), 위그노(프랑스) 표시. 칼뱅파 화살표는 제네바에서 프랑스·브리튼 제도 방향으로, 루터파 화살표는 비텐베르크에서 북유럽(스칸디나비아)·남독일 방향으로 뻗음*\n\n---\n\n**『독일』 루터의 종교 개혁**\n\n- 배경\n  - **교황 레오 10세의 면벌부 판매** [필기: 비판]\n    성 베드로 성당의 증축 비용 [필기: 초록 └→ 표시]\n    마련을 위해\n- [④ **95개조 반박문**] [필기] (1517) [필기: → 비텐베르크 대학에!]\n  - **교황의 면벌부 판매 비판**\n  - **신앙 생활의 핵심은 '성서'여야 한다고 주장**\n  - **인쇄술의 발전** 덕분에 빠르게 확산 [필기: : 성경 독일어 번역]\n- 독일 제후들의 루터 지지 vs 가톨릭\n- [⑤ **아우크스부르크**] [필기] 화의 체결(1555)\n  - 제후의 영지에서는 제후의 종교를 따른다는 원칙\n  - **루터파 허용**\n\n**『스위스』 [⑥ 칼뱅] [필기] 의 종교 개혁**\n\n- 스위스 츠빙글리의 영향을 받음\n- **예정설**\n  - 인간의 구원은 신에 의해 미리 정해져 있음\n  - **크리스트교 강요(기독교 강요) 저술**\n- **직업 소명설**\n  - 검소하고 근면한 생활 윤리 강조\n  - 경제적 성공을 신의 은총으로 여김\n- **신흥 상공업자의 호응으로 빠른 확산**\n  - **청교도(영), 고이센(네), 위그노(프), 장로파(스코)**\n\n**『영국』의 종교 개혁**\n\n- **헨리 8세**\n  - 헨리 8세의 이혼 문제로 교황과 대립\n  - [⑦ **수장령 (법)**] [필기] 발표(1534)\n    - └ **영국 국왕이 영국 교회의 수장**\n    - └ 영국 내 교회의 재산 몰수, 수도원 해산\n- **엘리자베스 1세**\n  - [⑧ **통일령 (법)**] [필기] 발표(1559)\n    - └ **영국 국교회 출범**\n    - └ 영국 교회가 교황으로부터 독립\n    - └ 로마 가톨릭 + 신교\n\n<!-- leaf-023 -->\n### p.51\n\n#### 3. 종교 전쟁\n\n> [필기] # 동인도 회사 ☆\n> · 영국(1600)  · 프랑스(1664)★  · 네덜란드(1602)\n\n- **위그노 전쟁(프)** [필기: 약 300여년간 지속(판독불확실 — '약 30여년간 지속'일 수 있음)]\n  - 신교도(위그노)와 가톨릭교도 간의 대립\n  - [⑪ **앙리 4세**] [필기]\n    - └ **부르봉 왕조 개창**\n  - ☆ [⑫ **낭트 칙령**] [필기] 발표(1598) [필기: 로 전쟁 수습]\n    - 위그노에게 신앙의 자유 부분 허용 [필기: 신교도]\n    - 루이 14세가 폐지(1685) [필기: 1598~1685]\n- **네덜란드 독립 전쟁**\n  - 에스파냐 [⑬ **펠리페 2세**] [필기] 의 **가톨릭 강화 정책에 반발**\n    - └ 종교 재판 강화, 고이센 탄압\n  - 에그몬트 백작과 오렌지공 윌리엄 등이 주도\n  - **베스트팔렌 조약으로 독립 달성** [필기: ↳(1648)]\n\n[필기: ≠ (위그노 전쟁과 30년 전쟁을 구분 표시)]\n\n- **30년 전쟁(신성 로마 제국)** [필기: (1618-1648)] – 신성 로마 제국 내의 구교와 신교의 대립\n\n**[구교]** [필기: +에스파냐]\n- 신성)페르디난트 2세\n  - 가톨릭 강화 정책\n\n**vs** [필기: ── 구스타브 2세 → but X] [필기: 구교인데 껴어기(판독불확실)]\n\n**[신교]** [필기: 승] [필기: +덴마크, 스웨덴, 프랑스]\n- 보헤미아)프리드리히 5세 [필기: → 슐레스비히, 홀슈타인 노리고 → but X]\n- 스웨덴)구스타브 2세 개입\n- 프랑스 신교 축으로 참전\n\n**→ [⑭ 베스트팔렌] [필기] 조약(1648)**\n- **칼뱅파 인정(루터파와 동등)** [필기: +아우크스부르크 화의 내용 인정 (재인정)]\n- **네덜란드 독립 승인(from 에스파냐)**\n- **스위스 독립 승인(from 신성로마제국)**\n- **신성 로마 제국의 유명무실화**\n- **프랑스)알자스·로렌 지역 획득**\n\n**[자료] 베스트팔렌 조약(1648)**\n\n1. 칼뱅파는 루터파와 동등한 특권을 가진다.\n2. 1624년 현재로 신교이든 구교이든 교회 재산을 그대로 유지한다.\n3. 신성 로마 제국의 황제 재판소에서 루터파와 칼뱅파는 같은 수의 재판관을 두고 재판을 주관한다.\n4. 각 제후는 자기 영내에서 실질적으로 독립 주권을 행사한다. [필기: → 신성) 유명무실화]\n5. 프랑스는 스트라스부르를 제외한 알자스·로렌을 차지한다.\n6. 네덜란드는 에스파냐로부터, 스위스는 신성 로마 제국으로부터 독립된 국가임을 인정받는다.\n\n<!-- leaf-024 -->\n### p.52\n\n\n#### 4. 평가응의 선택 – 평가원의 최신 기출 문항 Pick!\n\n**01** (가)에 들어갈 내용으로 가장 적절한 것은?  *(2024학년도 6월)*\n\n> **역사 동아리 활동 안내**\n>\n> 우리 동아리는 이탈리아에서 전개된 문예 부흥 운동에 대해 공부하고자 합니다. 이 운동은 그리스·로마 문화의 재생을 통해 인간과 세계를 재발견하려고 하였습니다. 이 운동이 벌어진 시기의 작가들에 대한 발표회를 개최하려고 하니, 아래 예시에 따라 발표문 제목을 알려주세요.\n>\n> - 발표문 제목 예시 -\n> - 페트라르카, 『칸초니에레』에서 진술한 감정을 노래하다.\n> - (가)\n\n- ① 루소, 사회 계약론에서 일반 의지를 설파하다.\n- ② 보카치오, 데카메론에서 인간의 위선을 풍자하다. [필기: ✓ 체크(정답 표시)]\n- ③ 뉴턴, 프린키피아에서 기계론적 우주관을 확립하다.\n- ④ 애덤 스미스, 국부론에서 고전 경제학의 토대를 마련하다.\n- ⑤ 토마스 아퀴나스, 신학대전에서 스콜라 철학을 집대성하다.\n\n**02** 밑줄 친 '저'에 대한 설명으로 옳은 것은?  *(2023학년도 6월)*\n\n> (말풍선 1) 신성 로마 제국 황제로서 나는 이 자리에서 너에 대한 처분을 결정할 것이다. 마지막 기회를 주겠다. 주장을 철회하겠느냐?\n>\n> (말풍선 2) 저의 주장은 성서에 근거하고 있습니다. 사람은 오직 신의 은총으로 믿음을 통해 구원에 이를 뿐, 교황에게는 사람의 죄를 용서할 권한이 없습니다. 면벌부 판매도 부당합니다. 저의 주장을 철회할 수 없고, 철회하지도 않겠습니다!\n\n![사진 · 말풍선 아래에 실린 역사화(흑백) — 실내 대회의장에서 성직자·귀족·군중이 둘러싼 가운데 검은 수도복 차림의 인물(루터)이 정면에 서 ](figures/fig-024-1.jpg)\n*그림 024-1 — 사진 · 말풍선 아래에 실린 역사화(흑백) — 실내 대회의장에서 성직자·귀족·군중이 둘러싼 가운데 검은 수도복 차림의 인물(루터)이 정면에 서 있고, 왼쪽 앞에는 붉은 옷의 추기경이 앉아 있는 장면. 보름스 제국 회의에서 루터가 심문받는 모습을 그린 그림 (캡션 없음)*\n\n- ① 예수회를 설립하여 선교 활동을 펼쳤다.\n- ② 크리스트교 강요를 집필하여 예정설을 주장하였다.\n- ③ 데카메론을 저술하여 타락한 사회상을 풍자하였다.\n- ④ 우신예찬을 출판하여 성직자의 부패를 고발하였다.\n- ⑤ 95개조 반박문을 발표하여 교회의 잘못을 비판하였다. [필기: ✓ 체크(정답 표시)]\n\n<!-- leaf-025 -->\n### p.57\n\n#### 1. 신항로 개척\n\n- 배경\n  - **동방에 대한 관심 증대**\n    - 마르코폴로 〈동방견문록〉, 잉글랜드인이 쓴 〈존 맨더빌 경의 여행기〉 등이 호기심 자극\n  - **동방의 산물에 대한 수요 증가**\n    - 후추, 향신료, 비단에 대한 수요 증가\n  - **새로운 교역로의 필요성**\n    - 이슬람과 이탈리아 상인들이 지중해 무역을 독점, 동방과의 직접 교역으로 필요\n  - **과학 기술의 발달**\n    - 지리학, 천문학, 조선술의 발달, 나침반의 사용 등으로 원양 항해 가능\n- **포르투갈 후원**\n  - 바르톨로뮤 디아스: [① **희망봉**] [필기] 발견(1488), 포)엔리크 왕자의 후원\n  - [② **바스쿠 다 가마**] [필기]: 인도 항로 개척(1498), 인도 캘리컷에 도달하는 항로\n  - 아시아 지역으로 진출\n    - 고아, 호르무즈, 믈라카, 마카오를 거점으로 동방 향신료 무역 전개\n- **에스파냐 후원**\n  - [③ **콜럼버스**] [필기]: 서인도 제도 도착(1492), 에)이사벨라 여왕의 후원\n    - 도착한 땅이 인도라고 생각\n  - 마젤란: **최초의 세계 일주(1519~22)**\n    - 대서양 횡단–아메리카 대륙–태평양–필리핀\n    - **필리핀 라푸라푸(막탄) 전투에서 마젤란 사망**\n    - 최초의 세계 일주 성공, 지구가 둥글다는 사실 입증\n  - 아메리카 문명 파괴\n    - **아스테카 문명** — 중부 멕시코 고원 일대\n      - 수도: [④ **테노치티틀란**] [필기]\n      - 피라미드식 신전, 그림 문자 사용\n      - 파괴: 에스파냐 [⑤ **코르테스**] [필기] 의 침략\n    - **잉카 문명** — 페루 남부의 안데스 고원 일대\n      - 수도: 쿠스코 / 대표적 도시: 마추픽추\n      - 새끼줄 매듭(키푸)으로 숫자와 의사 표시\n      - 파괴: 에스파냐 [⑥ **피사로**] [필기] 의 침략\n    - **아메리카의 변화**\n      - 원주민의 수 급감 니다. / 현재 **네덜란드가 가톨릭 강요 정책을 펼치는** (가) 에 맞서 독립 전쟁을 벌이고 있습니다. (가) 을/를 견제하고 평화를 유지해 나가기 위해서 협력하길 희망합니다.\n>\n> [필기: (가) : 에스파냐.]\n\n- ① 벵골 분할령을 발표하였다.\n- ② 레판토 해전에서 승리하였다. [필기: ✓ 체크(정답 표시)] [필기: 1571]\n- ③ 상트페테르부르크를 건설하였다.\n- ④ 콜베르를 등용하여 해외 시장을 개척하였다.\n- ⑤ 오스트리아와의 전쟁을 통해 슐레지엔을 차지하였다.\n\n**02** (가), (나) 국가에 대한 설명으로 옳은 것은?  *(2024학년도 수능)*\n\n![지도 · 남아메리카 대륙 개략도 — 대륙을 남북으로 가로지르는 점선의 '분할선'이 표시되어 있고, 서쪽 안데스 연안에 빗금(사선) 영역, 동쪽 ](figures/fig-028-1.jpg)\n*그림 028-1 — 지도 · 남아메리카 대륙 개략도 — 대륙을 남북으로 가로지르는 점선의 '분할선'이 표시되어 있고, 서쪽 안데스 연안에 빗금(사선) 영역, 동쪽 브라질 해안에 검은색 영역이 칠해져 있음. 범례: 빗금=(가)의 주요 지배 영역, 검정=(나)의 주요 지배 영역 (토르데시야스 조약에 의한 에스파냐·포르투갈 세력권 분할을 나타냄)*\n\n> 신항로 개척을 주도한 두 국가는 세력권 분할을 위한 **조약**을 체결하였다. 분할선을 기준으로 서쪽은 콜럼버스의 항해를 후원한 (가) 의 영역으로, 동쪽은 바스쿠 다 가마의 인도 항로 개척을 지원한 (나) 의 영역으로 정하였다. 그 후 (가) 은/는 원주민 제국을 파괴하고 주로 태평양 연안 지역을 장악하였고, (나) 은/는 오늘날의 브라질에 해당하는 지역을 차지하였다.\n>\n> [필기: (가) 위에 '에스', (나) 위에 '포르', '조약'에 동그라미]\n\n- ① (가) – 레판토 해전에서 승리하였다. [필기: ○ (정답 표시)]\n- ② (가) – 플라시 전투에서 프랑스를 격파하였다. [필기: 영]\n- ③ (나) – 필리핀을 둘러싸고 미국과 전쟁을 벌였다. [필기: 에스]\n- ④ (나) – 콜베르를 등용하여 중상주의 정책을 추진하였다. [필기: 프랑]\n- ⑤ (나) – 스웨덴과의 북방 전쟁을 통해 발트해로 진출하였다. [필기: 러]\n\n> [필기] ① (가) 에 / (나) 포\n\n<!-- leaf-029 -->\n### (쪽번호 없음)\n\nMEMO\n\n(인쇄된 MEMO 제목과 점선 괘선만 있는 빈 메모 쪽. 필기 없음.)\n\n<!-- leaf-030 -->\n### p.66\n\n## CHAPTER 06 시민 혁명(근대 사상 ~ 프랑스 혁명)\n\n#### 1. 근대 사상\n\n**16c — [과학 혁명]**\n\n- [① **코페르니쿠스**] [필기]\n  - 〈천체의 회전에 관하여〉\n  - **지동설 주장**\n- 베살리우스\n  - 인체 해부학 발전\n\n**17c — [과학 혁명]**\n\n- [② **케플러**] [필기]\n  - 행성의 타원 운동\n  - 지동설을 수정하고 입증\n- **갈릴레이**\n  - **망원경 제작(목성 관측)**\n  - 지동설 입증\n- [③ **뉴턴**] [필기]\n  - **만유인력의 법칙 발견**\n  - **기계론적 우주관**\n- 하비: 혈액순환의 원리\n\n**17c — [근대 철학]**\n\n- 경험론\n  - 영국 베이컨\n  - 귀납법 제시\n- 합리론\n  - 프랑스 데카르트\n  - 연역법 제시\n\n#### 2. 영국 혁명\n\n**[왕조 흐름 도식]** 엘리자베스 1세 → (X, ≠) → 제임스 1세 → 찰스 1세 → 공화정\n\n**엘리자베스 1세**\n- 후사 없이 사망\n- 튜더 왕조 단절\n\n**제임스 1세** [필기: ≠ (스코)제임스 6세]\n- [⑫ **스튜어트**] [필기] **왕조 개창** ☆\n- 왕권신수설 신봉\n- 전제정치 확대\n- 의회 무시, 청교도 박해\n  - 청교도인 아메리카 이주\n\n**찰스 1세** [필기: 장자: 찰스 2세 / 차남: 제임스 2세]\n- 청교도 가리키는 화살표]\n[필기: → 영국 — '이 왕국'을 가리키는 화살표]\n[필기: '나는', '군대', '공화정', '또다시', '주교', '막을' 등에 동그라미·밑줄]\n\n> [필기] 메리 & **윌리엄** (윌리엄에 네모)\n\n- ① 수장법을 발표하였다. [필기: 헨리8]\n- ② 호국경에 취임하였다. [필기: → (크)] — ②에 X 표시\n- ③ 무적함대를 이끌었다. [필기: 에스)펠4]\n- ④ **권리 장전을 승인하였다.** [필기: ○ 표시, ④에 체크 — 학생이 고른 답]\n- ⑤ 낭트 칙령을 반포하였다. [필기: 앙리 4세 (1598) ~ (1685)]\n\n**02** 밑줄 친 '새로운 정부'에 대한 설명으로 옳은 것은? &nbsp;&nbsp;<sub>2024학년도 수능</sub>\n\n> 시에예스를 비롯한 일단의 정치가들이 이탈리아 원정 등으로 인기가 높았던 장군을 앞세워 정변을 일으켰다. 파리 각지에 병력이 배치되고 정부에 대한 압박이 이루어지는 가운데 5명의 총재 중 3명이 스스로 물러났고 사임을 거부한 2명은 감금되었다. 다음 날 정변 주도자들은 의회에서 근위대를 동원하여 반대파의 저항을 무력으로 제압하였다. 곧이어 시에예스 등은 반대파 의원들을 자코뱅으로 규정하여 축출하였고 새로운 헌법 제정에 착수하였다. 이에 대의제, 소유권, 평등권, 자유권 등을 담은 헌법이 제정되었고, 이를 토대로 <u>새로운 정부</u>가 공식적으로 수립되었다.\n\n[필기: '이탈리아' 위에 '북부'] [필기: '시에예스', '파리', '장군', '자코뱅'에 동그라미]\n[필기: ↳ 나폴레옹 / 통령정부.]\n\n- ① 프로이센과의 전쟁에서 패하여 붕괴되었다.\n- ② 공화정을 선포하고 파리 코뮌을 진압하였다.\n- ③ **교육 제도를 개혁하고 국민 투표를 실시하였다.** [필기: ○ 표시, ③에 체크 — 학생이 고른 답]\n- ④ 영국을 굴복시키기 위해 대륙 봉쇄령을 발표하였다. [필기: 제정]\n- ⑤ 제한 선거제에 토대를 둔 입헌 군주제를 시행하였다.\n\n---\n\n<!-- leaf-037 -->\n### (쪽번호 없음)\n\n**MEMO** (인쇄된 메모 전용 줄 노트 쪽)\n\n(빈 쪽 — 필기 없음)\n\n---\n\n<!-- leaf-038 -->\n### p.80\n\n## CHAPTER 07 시민 혁명(빈 회의 ~ 러시아 발전)\n\n#### 1. 빈 체제\n\n(쪽 왼쪽 가장자리에 'MEMO' 인덱스 탭)\n\n**나폴레옹 몰락**\n\n- 자유주의 확산\n- 민족주의 확산\n\n**빈 회의(1814~15)** &nbsp;&nbsp;**vs** (빨간 양방향 화살표) → 오른쪽 자유주의·민족주의 운동들\n\n- **오스트)재상 [① 메테르니히] 주도** [필기]\n- **프랑스 혁명 이전으로 돌아가자**\n  - 정통주의, 복고주의 표방\n  - 자유주의, 민족주의 탄압\n- [② **신성**] **동맹: 오스트+프로+러** [필기]\n- **4국 동맹: 신성 동맹+영** [필기: 영: 캐슬레이 남작]\n- 주요 의결 내용\n  - **스위스) 영세 중립국 지위 획득**\n  - **벨기에) 지배권: 오스트→네덜란드**\n  - **오스트) [③ 베네치아] 획득** [필기]\n  - **[④ 독일]연방 결성: 오스트) 주도** [필기]\n  - **프랑스)부르봉 왕조 부활(복고)** [필기: 1번째 왕정복고] [필기(빨강): (왕정복고)]\n    - **루이 18세 – 샤를 10세**\n\n**(오른쪽 계열: 빈 체제에 대한 저항)**\n\n- 러)[⑤ **데카브리스트**] 봉기(1825) [필기]\n  - 청년 장교와 일부 지식인 주도\n  - 입헌 군주제 지향하며 봉기\n  - [⑥ **니콜라이 1세**]의 진압 [필기]\n- 독)부르셴샤프트 운동\n  - 학생들의 조합 운동\n- 이)카르보나리당\n  - 민족주의 운동 전개, 실패\n- 그리스 독립 전쟁(1821~29)\n  - 오스만 제국의 지배에 저항\n  - [⑦ **키오스섬**]의 학살 [필기]\n    - 오스만의 그리스인 학살\n  - 영, 프, 러가 그리스 지원\n  - 유럽 지식인들의 그리스 지지\n    - → 그리스 독립(1829) [필기(빨강): 〈아드리아노플 조약〉] [필기(파랑): ↳ 오스만 타격. 빈체제 균열 본격화.]\n- 미)[⑧ **먼로선언**](1823) [필기]\n  - 유럽과 아메리카 불간섭 선언\n  - 라틴 아메리카의 독립 운동에 영향\n  - > [필기] ✱ 아이티 독립 (1804) from 프랑스\n\n##### ■ 빈 회의 (하단 자료 상자)\n\n- 스위스의 중립은 8국 위원회에 의하여 보장된다.\n- 오스트리아는 남독일과 남부 네덜란드를 포기하는 대가로, 롬바르디아와 베네치아를 새로이 얻는다.\n- 프로이센은 작센의 영토 58%를 가지며, 바르샤바 대공국의 일부인 포젠 공국과 단치히, 라인란트, 베스트팔렌을 가진다.\n- 예전의 신성로마제국의 제후국을 38개의 연방 국가로 모아 독일 연방으로 창설한다. 연방의 의장은 오스트리아 황제로 한다.\n\n---\n\n<!-- leaf-039 -->\n### p.81\n\n#### 2. 프랑스의 발전\n\n##### 7월 혁명(1830)\n\n> [필기(왼쪽 여백)] 루이 18세 ↳ 부르봉 왕조 (백색기) →\n\n- [⑨ **샤를 10세**]의 7월 칙령 [필기]\n  - 의회 해산 [필기(파랑): ↳ 기본권 제한]\n  - 출판의 자유 등 금지\n  - 특권층에게만 투표권 부여\n  ↓\n- **7월 왕정 수립** (형광펜, '왕정'에 빨간 동그라미) [필기: 티에르, 기조, 몰레] [필기(빨강): ↳ 이오터! (판독불확실)]\n  - 샤를 10세 추방\n  - [⑩ **루이 필리프**] 즉위 [필기] [필기: '시민의 왕']\n  - 입헌 군주제 수립\n  - 제한된 선거권\n  - 삼색기 부활\n    - 부르봉 왕조는 백색기 사용\n  ↓\n- 영향\n  - 벨기에 독립(from 네덜란드)\n  - 이)청년 이탈리아당 결성\n    - 마치니 주도\n  - 독)[⑪ **관세동맹**] (1834) [필기] (★ 표시)\n    - 프로이센 주도\n  - 영)1차 선거법 개정(1832)\n\n##### 2월 혁명(1848)\n\n- 배경\n  - 7월 왕정의 보수화 [필기(파랑): 개혁X]\n  - 산업화로 인한 노동자 성장\n  - 흉년, 사회 혼란\n  - 사회주의 사상의 확산 [필기(초록): 마르크스 「공산당 선언」(1848)]\n  - > [필기(보라)] → 선거권 확대 요구 (노동자, 시민)\n- 루이 필리프 퇴위(영국에 망명) [필기(빨강): 〈7月 왕정의 붕괴〉]\n- 혁명 이후 구성된 임시 정부\n  - **공화정 선포, 보통 선거 진행**\n  ↓\n- **제2공화정 수립** (형광펜) [필기(빨강): 1848] [필기(보라): '프랑스 최초의 대통령 선거']\n  - 루이 나폴레옹 대통령 당선\n  - (나폴레옹의 조카)\n  - > [필기(빨강)] ≠ 나 1세는 강 승인 받은 것 (대통령 선거X) — '강' 판독불확실\n  ↓\n- 영향\n  - 오스트)3월 혁명\n    - 메테르니히 실각\n    - 빈 체제 붕괴\n  - 〈독)프랑크푸르트 회의〉 [필기(초록): '국민의회' (프랑스X)]\n    - 독일 통일 방안 논의\n  - 이)청년 이탈리아당 혁명\n  - > [필기(보라)] 프로) 프랑크푸르트 회의 (1848-49)\n\n##### 제2제정\n\n> [필기] 1852-1870 / 2번째 왕정 복고 / ↗ 보불전쟁 패배후 물러남 (프로이센 vs 프랑스, 1870-1871)\n\n- 루이 나폴레옹\n  - 친위 쿠데타, 국민 투표로 **황제** 즉위 ('황제'에 동그라미) [필기: (1852)]\n  - → 나폴레옹 3세 [필기(빨강): ≠ 나폴레옹 1세]\n  ↓\n- 대외 팽창(오지랖 대마왕)\n- 크림 전쟁(1853~56) 참전\n- 이탈리아와 군사 동맹 체결\n  - [⑫ **프롱비에르**] 협정(1858) [필기]\n  - 이탈리아 통일 전쟁 지원\n  - 사부아, 니스 지역 획득 [필기: →〈토리노 조약〉 / 1860]\n- 2차 아편 전쟁(1856)\n  - 영국과 함께 청 왕조와 전쟁\n- 베트남과 1차 사이공 조약(1862)\n  - 베트남 개항\n- [⑬ **멕시코**] 내전 개입 [필기]\n  - 오스트) 대공 막시밀리안을 황제로 앉히려다 실패\n  ↓\n- [⑭ **보불**] 전쟁(1870~71) 패배 [필기, '보불'에 빨간 동그라미]\n  - > [필기(보라)] 에스파냐 국왕선출 문제 (1868. 쿠데타 → 혁명 → 이사벨 2세 퇴위 → 아들에게 계승 문제)\n  - vs 프로이센과의 전쟁에서 패배 [필기(빨강): 프로) 알·로 get.]\n  - 스당 전투에서 나폴레옹 3세 생포 [필기(초록): 1870.9月]\n  - 제2제정 붕괴 [필기(자홍): 종전조약 〈프랑크푸르트 조약〉]\n  ↓ [필기(초록): 제3공화정 (1870 – 1940) ↳ 2차 war 파리수복]\n- [⑮ **파리코뮌**] [필기: 1871]\n  - 프로이센과의 굴욕적인 강화 반대\n  - **파리 시민과 노동자 봉기, 자치 정부**\n  - 징병제, 국민군 설치 등의 정책 발표\n  - 독일의 지원 받은 **제3공화정**이 진압 ('제3공화정'에 초록 동그라미)\n    - **'피의 일주일'이라는 시가전**\n\n##### (쪽 왼쪽 하단에 붙인 인쇄물 — 독일 국기 아이콘) 1848년 프랑크푸르트 국민의회\n\n**배경**\n\n- 1848년 **2월 혁명** → 자유주의·민족주의 확산\n- 당시 독일은 하나의 통일국가 X\n- 프로이센·오스트리아·바이에른 등 여러 독일계 국가로 **분열** ('분열'에 초록 동그라미)\n- 여러 국가가 **독일 연방**이라는 느슨한 연합을 구성 ('독일 연방'에 초록 네모)\n\n**프랑크푸르트 국민의회 (1848)**\n→ 독일 통일 방안 논의\n\n- 소독일주의: 오스트리아 제외 + **프로이센 중심 통일** (초록 선으로 아래 '프로이센 중심 통일'과 연결)\n- 대독일주의: 오스트리아 포함하여 통일\n\n**결과**\n→ 통일 실패\n→ 이후 비스마르크가 프로이센 중심 통일 추진\n→ 1871년 독일 제국 성립\n\n⭐ **핵심**\n> 독일이 '분단'된 것이 아니라, 여러 독일계 국가로 나뉘어 있던 상태에서 통일을 논의한 것\n\n---\n\n<!-- leaf-040 -->\n### p.82\n\n\n#### 3. 이탈리아의 통일\n\n- 통일 전 이탈리아 — 교황령과 여러 왕국 등으로 오랜 시간 분열 / 북부 지역은 오스트리아의 간섭과 지배\n- 프)7월 혁명 → **청년 이탈리아당 결성**, 마치니 주도\n- 프)2월 혁명 → 청년 이탈리아당 **혁명**: 민족 통일과 민주개혁 추구, 실패\n\n**샤르데냐 왕국** : 이탈리아 통일을 주도\n\n![연표 · 이탈리아 통일 연표(1848~1861). 검은 화살표 연도 박스 1848·1852·1858·1861이 가로선 위에 배열되고 각 아래에 ](figures/fig-040-1.jpg)\n*그림 040-1 — 연표 · 이탈리아 통일 연표(1848~1861). 검은 화살표 연도 박스 1848·1852·1858·1861이 가로선 위에 배열되고 각 아래에 사건이 달림. 1852와 1858 사이 위쪽에 학생이 「1853」을 적어 넣고 크림전쟁 참전으로 연결함. 아래 본문이 그 전체 내용.*\n\n- **1848**\n  - vs 오스트리아\n    - 패배\n- **1852**\n  - **① 카보우르** [필기: 빈칸에 '카보우르' 기입]\n    - 재상 취임 [필기: 크림전쟁 참전 (1853)]\n    - [필기] 프) 나폴레옹 3세\n    - [필기] 샤르데냐\n- **1858**\n  - **② 플롱비에르 협정**\n    - 프랑스와 군사 동맹\n    - 프)나폴레옹 3세\n    - 오스트리아와 전쟁 발발시 프랑스의 군사적 지원 약속\n    - 전쟁에 승리할 경우\n      - 이)중북부 이탈리아 병합\n      - 프)사부아, 니스 할양\n  - 1859년 vs 오스트리아 [필기: 〈솔페리노 전투〉 1859]\n    - 프랑스의 군사 지원\n    - 샤르데냐의 승리 → [필기: 중부이탈 (오스트리아 → 미수복 지역)]\n    - 중북부 이탈리아 병합 [필기: 강화조약 / (베네치아) / 빌라 프랑카 휴전]\n    - 프)사부아, 니스 획득 [필기: 〈토리노 조약〉 1860]\n  - **③ 가리발디** [필기: 1860~61]\n    - 붉은 셔츠단(의용군)\n    - 이탈리아 남부 원정\n      - 시칠리아, 나폴리 점령\n    - 샤르데냐에 헌납\n- **1861**\n  - 이탈리아 왕국 수립\n    - 미수복 지역\n      - 베네치아, 교황령\n  - **④ 베네치아** 병합(1866)\n    - 프로 vs 오스트 전쟁 중\n  - **⑤ 교황령** 병합(1870)\n    - 프로 vs 프랑스 전쟁 중\n\n#### 4. 독일의 통일\n\n- 프)7월 혁명 → **관세 동맹(1834)**: 프로이센 주도, 독일 내 국가 사이의 관세 폐지로 경제 통합 [필기: 오X]\n- 프)2월 혁명 → **프랑크푸르트 의회 개최(1848~49)**: 독일 **통일** 방안 논의(오스트리아 포함 여부: 소독일주의 vs 대독일주의) [필기: 오O]\n\n![연표 · 독일 통일 연표(1862~1871). 「프로이센」 말머리 박스 뒤로 검은 화살표 연도 박스 1862·1864·1866·1870·1871](figures/fig-040-2.jpg)\n*그림 040-2 — 연표 · 독일 통일 연표(1862~1871). 「프로이센」 말머리 박스 뒤로 검은 화살표 연도 박스 1862·1864·1866·1870·1871이 가로선 위에 배열되고 각 아래에 사건이 달림. 학생이 형광펜·볼펜으로 전쟁 명칭과 조약을 여러 겹 덧붙여 놓음. 아래 본문이 그 전체 내용.*\n\n- **1862**\n  - **⑥ 비스마르크**\n    - 재상 취임\n    - **철혈 정책**\n      - 군비 확장\n- **1864**\n  - 2차 슐레스비히 전쟁\n    - vs **⑦ 덴마크**\n    - 슐레스비히 장악\n    - 홀슈타인 장악\n    - [필기] 프로 + 오스트\n- **1866**\n  - **⑧ 오스트리아 승** [필기: 프로이센 승 / 프로-오 전쟁 / 보오전쟁 / 그리스 전투(판독불확실)]\n  - **⑦ 북독일 연방** 지원(1867)\n  - [필기] 헝가리 제국과 협상을 통해 제국 수립 (오스트리아-헝가리 제국, 1867)\n  - [필기] 프랑스 낭독일 연방 (판독불확실)\n- **1870**\n  - vs **프랑스 승** [필기: 프로이센]\n  - 보불 전쟁\n  - [필기] ⑨ 왕위계승 문제 / 프로이센의 확전 / ⑩ 북독일 지원 / 〈엠스 전보 사건〉\n- **1871**\n  - 독일 제국 수립\n    - 베르사유 궁전 즉위식 [필기: infrance]\n    - 빌헬름 1세\n  - [필기] ⑪ 파리코뮌 (1871)\n- [필기] 하단 여백: 「프란츠 1세(판독불확실) / 마리아 테레지아(판독불확실)」, 「〈보불전쟁〉: 43 성포 - 〈프랑크푸르트 조약〉」 (판독불확실)\n\n<!-- leaf-041 -->\n### p.83\n\n#### 5 영국의 자유주의 개혁\n\n- 선거법 개정\n  - 1차(1832): 프)[⑨ **7월**] [필기] 혁명의 영향, **부패** 선거구 조정, 도시 상공업자에게 **선거권** [필기: ★(빨간 별 표시)]\n  - [⑩ **차티스트**] [필기] 운동 (1838~48)\n    - 노동자 계층이 보통 선거와 비밀 투표를 요구하는 **인민헌장** 발표 [필기: 1838]\n    - 영국 정부의 탄압, 요구 사항은 이후 법 개정으로 점차 수용\n  - 2차(1867): 도시 소시민과 노동자에게 선거권 부여\n  - 3차(1884): 농촌과 광산 노동자에게 선거권 부여\n  - **4차(1918)**: 21세 이상의 남성, **30세 이상의 여성**에게 선거권 부여 [필기: 4차에 동그라미, ★(빨간 별 표시)]\n  - 5차(1928): 21세 이상의 남녀에게 선거권 부여\n- 종교적 차별 폐지\n  - [⑪ **심사법**] [필기] 폐지(1828): 비국교도에게 공직 허용 [필기: 1673(판독불확실)]\n  - [⑫ **가톨릭 해방법**] [필기] (1829): 가톨릭교도에 대한 차별 대부분 철폐\n- 경제적 차별 폐지\n  - [⑬ **곡물법**] [필기] 폐지(1815~1846): 수입 곡물에 관세 부과, 지주를 보호하던 **법률 폐지**\n  - [⑭ **항해법**] [필기] 폐지(1651~1849): 자유주의적 경제 체제 수립\n\n> [필기] 곡물법 : 2차 인클로저 운동. → 산업Ⓡ(산업혁명?(판독불확실)) → 지주 대토지 소유\n\n#### 6 미국의 발전\n\n- 독립 이후 미국: 민주주의 발전, 서부 개척으로 태평양 연안까지 확장\n- 남북 전쟁 [필기: (1861~65)]\n  - 배경\n    - 산업화 과정에서 **남부와 북부의 차이, 갈등과 대립**\n    - 북부: 상공업 발달, <u>노예제 반대</u> / 남부: 농업 발달, <u>노예제 찬성</u>\n  - **링컨 대통령 당선(1861): 노예제 확대에 반대하던 링컨**\n  - **남부의 주가 연방에서 탈되(탈퇴), 남북 전쟁 발발(1861~65)**\n  - **[⑮ 노예 해방령] (1863): 링컨의 노예 해방 선언** [필기: 노예 해방령]\n  - **게티즈버그 전투(1863)에서 북부의 승리**\n- 남북 전쟁 이후 국민적 단합, **대륙 횡단 철도** 건설(1869)\n\n> [필기] <미·서 전쟁> (1898. 4~7月)\n> - 1898. 에)쿠바 : 소요 사태 → 미국인 보호 명분\n>   - → 미) 메인호 파견… 폭파\n>     - ↳ 에스파냐의 지뢰 공격!\n> - <파리조약>(1898) = 파리강화조약\n>   - 쿠바, 필리핀, 괌, 푸에르토리코 → 미)\n>   - 미) 에스파냐에 2000만 $ 지급\n> - 1898. 7月 미) 하와이 합병 → 1900 발효\n\n(※ 위 필기 왼쪽에 회색으로 덧칠되어 지워진 부분 있음 — 판독불가)\n\n#### 7 러시아의 발전\n\n- 19c 러시아는 군사 대국이었지만, **차르의 전제 정치와 농노제가 지속**된 지역\n\n| [⑯ 니콜라이 1세] [필기] | [⑱ 알렉산드르 2세] [필기] |\n| --- | --- |\n| – 데카브리스트 봉기를 진압하며 즉위 | – 크림 전쟁 도중 즉위 |\n| – 남하 정책 추진 | – 농노 해방령(1861) |\n| – [⑰ 크림전쟁] 발발(1853~56) [필기: 크림전쟁] | – 징병제, 지방 의회 설립 [필기: 두마 X (지방 의회에 동그라미)] |\n| &nbsp;&nbsp;└ vs 오스만 제국(영, 프, 프로, 샤르) [필기: \"프로\"에 물결 밑줄 + 화살표 → 프로이센 / 중립국] | – 브나로드 운동 전개 [필기: (계몽운동)(1873~1875)] |\n| &nbsp;&nbsp;└ 전쟁 중에 니콜라이 1세 사망 [필기: 1855] | – 무정부주의자에 의해 암살 |\n\n![지도 · 크림 전쟁 전황도 — 흑해 일대. 표기 지명: 오스트리아, 다뉴브공국, 크림반도, 러시아, 타간로크, 세바스토폴(1854~1855), ](figures/fig-041-1.jpg)\n*그림 041-1 — 지도 · 크림 전쟁 전황도 — 흑해 일대. 표기 지명: 오스트리아, 다뉴브공국, 크림반도, 러시아, 타간로크, 세바스토폴(1854~1855), 발라클라바(1854), 바르나, 흑해, 콘스탄티노폴, 시노페(1853), 바투미, 보스포루스해협, 마르마라해, 다르다넬스해협, 그리스, 오스만 투르크 제국, 지중해, 팔레스타인, 네지드. 범례: 파란 화살표=영국과 프랑스 함대, 빨간 화살표=투르크 함대, 빨간 별표=격전지. [필기: 시노페에 ①, 세바스토폴에 ② 표시, 발라클라바 위에 빨간 화살표와 \"안에\"(판독불확실)]*\n\n---\n\n<!-- leaf-042 -->\n### p.84\n\n\n![지도 · ▲ 이탈리아 통일 — 이탈리아 반도. 표기 지명: 사보이아, 롬바르디아, 제노바, 파르마, 니스, 베네치아, 피렌체, 아드리아해, 코르](figures/fig-042-1.jpg)\n*그림 042-1 — 지도 · ▲ 이탈리아 통일 — 이탈리아 반도. 표기 지명: 사보이아, 롬바르디아, 제노바, 파르마, 니스, 베네치아, 피렌체, 아드리아해, 코르시카(프), 교황령, 로마, 나폴리, 양시칠리아 왕국, 사르데냐, 팔레르모. 설명 상자: \"1870년 이탈리아 경계\", \"가리발디의 원정로\"(붉은 화살표 경로). 범례: 1815년 사르데냐 왕국 / 1861년 이탈리아 왕국 / 1866년과 1870년에 회복 / 1860년 프랑스에 할양 / 미수복 지역(1919년 획득). [필기: 베네치아에 ①, 로마에 ②, 범례의 \"1866년\" 앞에 ①, \"1870년에 회복\" 앞에 ② 동그라미 표시]*\n\n![지도 · ▲ 독일 통일 — 중부 유럽. 표기 지명: 발트해, 슐레스비히, 홀슈타인, 베를린, 러시아, 네덜란드, 하노버, 슐레지엔, 작센, 베스](figures/fig-042-2.jpg)\n*그림 042-2 — 지도 · ▲ 독일 통일 — 중부 유럽. 표기 지명: 발트해, 슐레스비히, 홀슈타인, 베를린, 러시아, 네덜란드, 하노버, 슐레지엔, 작센, 베스트팔렌, 바이에른, 오스트리아, 프랑스, 알자스, 로렌, 스위스. 설명 상자: \"프로이센·프랑스 전쟁(1870)\", \"프로이센·오스트리아 전쟁(1866)\". 범례: 1866년 이전 프로이센령 / 1866년 이후 프로이센령 / 1867 연방에 합류한 국가 / 1867년 성립한 북독일 연방의 남쪽 경계 / 1871년 성립한 독일 제국의 경계*\n\n![지도 · ▲ 미국의 영토 확장 — 미국 본토와 알래스카·하와이. 표기: 북태평양 철도(1883), 영국으로부터 할양(1818), 영국으로부터 할](figures/fig-042-3.jpg)\n*그림 042-3 — 지도 · ▲ 미국의 영토 확장 — 미국 본토와 알래스카·하와이. 표기: 북태평양 철도(1883), 영국으로부터 할양(1818), 영국으로부터 할양(1842), 포틀랜드, 오리건 병합(1846), 밀루스(밀워키), 유니언 중앙 태평양 철도(1869), 새크라멘토, 샌프란시스코, 오마하, 프랑스로부터 루이지애나 매입(1803), 영국으로부터 할양(1783), 건국 13주(1776), 멕시코로부터 할양(1848), 남태평양 철도(1883), 텍사스 병합(1845), 뉴올리언스, 멕시코로부터 개즈던 매입(1853), 에스파냐로부터 할양(1819), 알래스카 러시아로부터 매입(1867), 하와이 병합(1898). 범례: 주요 대륙 횡단 철도(숫자는 개통 연도). [필기: \"병합(1898)\"과 \"매입(1853)\"에 동그라미 표시]*\n\n\n---\n\n<!-- leaf-043 -->\n### p.95\n\n#### 1 산업 혁명\n\n- 배경 [필기: why 영국]\n  - 정치적 안정, 의회 정치의 발전\n  - 인구 증가와 해외 식민지 확보\n  - <u>2차 인클로저 운동</u>으로 도시 노동자 확보\n  - <u>철</u>, 석탄 등의 풍부한 지하자원\n- 산업 혁명\n  - **면직물 공업 발달**\n    - └ **방적기, 방직기 발명**\n  - **제임스 와트: 증기기관 개량**\n  - **영)스티븐슨: 증기 기관차 제작**\n  - **미)풀턴: 증기선 상용화**\n- 확산\n  - 19c 전반: 벨기에, 프랑스 → 19c 중반: 미국, 독일, 러시아, 일본까지 확산 [필기: ★곡물법(1815)]\n  - 19c 후반부터는 <u>독일</u>과 <u>미국</u>이 강력한 공업국으로 성장 [필기: 독일에 화살표 — 비스마르크 (1862); 독일·미국에 동그라미]\n- 영향\n  - 사회 구조의 변화: 자본주의 경제 체제 형성, 도시 성장, <u>자본가와 노동자 계급</u> 발생\n  - 사회 문제의 발생: 노동 문제(저임금, 장시간 노동, 아동 노동 등), 도시 문제 발생\n  - 노동 운동\n    - **기계 파괴 운동([① 러다이트] 운동)** [필기: 러다이트] [필기: '네드 러드']\n    - **공장법** 제정: 장시간 노동 제한, 여성과 아동 노동자 보호 [필기: →1833]\n    - 차티스트 운동: 노동자의 참정권 운동 [필기: 차티스트 운동 부분에 동그라미]\n  - 사회주의\n    - 자본주의 비판, 평등 사회를 주장하며 등장\n    - 초기 사회주의(생시몽, 푸리에, 오언): 경쟁 대신 협동 강조 [필기: 뉴래너크 '협동촌']\n    - **과학적 사회주의(마르크스, 엥겔스): 노동자의 계급 투쟁, 〈공산당 선언, 1848〉**\n\n(우측 여백에 인쇄된 `MEMO` 칸)\n\n**[자료]**\n\n사회주의는 산업화에 따른 자본주의적 변화, 즉 <u>시장 원리에 따라 가진 자들이 이익을 보는 자유 방임 경제 체제에 반대하는 사상</u>을 뜻한다. 부르주아 계급은 경쟁이나 자유와 같은 개인주의 가치를 강조하였지만, 초기 사회주의자들은 협동, 평등과 같은 집단주의 가치를 존중하였다. 그들은 생산 수단의 사유화와 사유 재산을 반대하고 공동 생산과 공동 분배를 통해 부의 평등이 실현되는 사회를 건설하고자 하였다. 이러한 주장을 펼친 생시몽, 푸리에, 오언 등 초기 사회주의자들을 공상적 사회주의자라고 한다.\n\n사회주의 사상을 과학적인 공산주의 이론으로 체계화하고 국제노동자 운동에 앞장선 사람은 엥겔스와 마르크스였다. **마르크스는 유물 사관에 기초하여 자본주의 사회 붕괴를 예언하였으며 제1 인터내셔널 창립 연설에서 노동자가 <u>스스로</u> 정치권력을 획득해야 한다고 역설하였다.** (형광펜 강조)\n\n![사진 · ▲ 제1 인터내셔널 창립 대회 — 회의장 단상과 방청석을 가득 메운 대의원들을 그린 흑백 판화/그림. [필기: ↳ 국제 노동자 협회]](figures/fig-043-1.jpg)\n*그림 043-1 — 사진 · ▲ 제1 인터내셔널 창립 대회 — 회의장 단상과 방청석을 가득 메운 대의원들을 그린 흑백 판화/그림. [필기: ↳ 국제 노동자 협회]*\n\n---\n\n<!-- leaf-044 -->\n### p.96\n\n#### 2 제국주의_아프리카 분할\n\n(좌측 여백에 인쇄된 `MEMO` 칸)\n\n> [필기] 영국: 이·수·우·케·소·로·남· 나·가·시·감\n> [필기] 프랑스: 튀·오·알·지·마·콩!\n> [필기] 독일: 나미·탄자니·카·톡·기!\n\n- 의미: 19c 말 ~ 20c 초 서구 열강이 경제력과 군사력을 앞세워 식민지 건설을 추진한 대외 팽창 정책\n- 제국주의 = 독점 자본주의 + 침략적 민족주의 + 사회 진화론 + 인종주의\n\n![지도 · ◀ 열강의 아프리카 분할 — 아프리카 대륙 전체의 열강 세력권 지도. 표기 지명: 카사블랑카, 알제리, 튀니지, 모로코, 지중해, 카이](figures/fig-044-1.jpg)\n*그림 044-1 — 지도 · ◀ 열강의 아프리카 분할 — 아프리카 대륙 전체의 열강 세력권 지도. 표기 지명: 카사블랑카, 알제리, 튀니지, 모로코, 지중해, 카이로, 리비아, 이집트, 서사하라, 수단, 에리트레아, 지부티, 감비아, 기니, 나이지리아, 시에라리온, 토고, 카메룬, 파쇼다, 에티오피아, 우간다, 소말리아, 라이베리아, 대서양, 프랑스령 콩고, 벨기에령 콩고, 동아프리카, 케냐, 앙골라, 모잠비크, 서남아프리카, 로디지아, 마다가스카르, 남아프리카 연방, 케이프타운. 설명 상자: \"파쇼다 사건(1898)\". 범례: 영국령·프랑스령·독일령·이탈리아령·포르투갈령·에스파냐령·벨기에령·독립국, 그리고 영국의 진출 방향(빨간 화살표, 종단)·프랑스의 진출 방향(보라 화살표, 횡단)·독일의 진출 방향(녹색 화살표). [필기: 튀니지 위에 \"〈바르도 조약〉으로 프랑스의 보호령됨\"; 지부티(프); 소말리란드 +(1960): 소말리아; 영국령 + 이탈리아령; 탄자니아(동아프리카 옆); 나미비아(서남아프리카 아래); 알제리·튀니지·모로코·이집트·수단·감비아·시에라리온·토고·나이지리아·우간다·케냐·콩고·로디지아·마다가스카르·남아프리카 연방 등에 동그라미 표시]*\n\n> [필기] #  화살표 연도 박스 1969·1972·1975·1979가 가로선 위에 배열되고 각 아](figures/fig-060-1.jpg)\n*그림 060-1 — 연표 · 냉전 완화(데탕트) 연표(1969~1979). 검은 화살표 연도 박스 1969·1972·1975·1979가 가로선 위에 배열되고 각 아래에 사건이 달림. 1969 옆에 학생이 「→ 완화」, 「69~74」를 적어 넣음. 아래 본문이 그 전체 내용.*\n\n- **1969** [필기: → 완화 / 69~74]\n  - **⑧ 닉슨 독트린**\n    - 아시아에 대한 미국의 직접 개입 지양 [필기: 신앙(판독불확실)]\n    - 베트남 전쟁 철수 명분\n  - **중·소 국경 분쟁**\n    - 우수리강 인근 충돌\n      - → 중)새로운 파트너 모색\n      - → 미)소련 견제 파트너 모색 [필기: 69~89]\n  - **서독) ⑨ 빌리 브란트** 총리\n    - 동방 정책 추진 [필기: to 동유럽·동독과 사이 좋게…]\n- **1972**\n  - 미)닉슨, 중국 방문\n    - 미중 공동 성명 발표\n  - **전략 무기 제한 협정**\n    - 미+소, SALT [필기: 미사일 제한(판독불확실)]\n  - 동서독 기본 조약(1972)\n  - **동서독 UN 동시 가입(1973)**\n  - 서독/소련과 불가침 조약(1972)\n- **1975**\n  - **⑩ 헬싱키 협약**\n    - 유럽 안보 협력 회의\n    - 미+캐+소+유럽 국가(35개국)\n    - 주권 존중, 전쟁 방지 등\n- **1979**\n  - 미중 수교\n  - 소)아프간 침공 [필기: 아프간~ (냉전 v2c) (판독불확실)]\n\n![연표 · 냉전 해체 연표(1985~1991). 검은 화살표 연도 박스 1985·1989·1990·1991이 가로선 위에 배열되고, 1989 아래](figures/fig-060-2.jpg)\n*그림 060-2 — 연표 · 냉전 해체 연표(1985~1991). 검은 화살표 연도 박스 1985·1989·1990·1991이 가로선 위에 배열되고, 1989 아래에 주황 테두리 「동유럽 혁명」 박스가, 1991 아래에 「※ 소련 대통령」 점선 박스가 놓임. 1991 위에 학생이 「'민스크 협의'」를 적음. 아래 본문이 그 전체 내용.*\n\n- **1985**\n  - **소) ⑪ 고르바초프 집권**\n    - 페레스트로이카(개혁)\n    - 글라스노스트(개방)\n    - 아프간 철수(1989)\n    - **동유럽 불간섭 선언** (88) [필기: 신베오그라드 선언]\n- **1989**\n  - **[동유럽 혁명]**\n    - **폴) ⑫ 바웬사**\n      - 자유노조 결성(1980)\n      - **자유노조 혁명(1989)**\n      - 대통령 당선(1990)\n    - **체) ⑬ 하벨**\n      - 벨벳 혁명\n      - 시민광장(시민포럼)\n    - 헝)다당제, 민주주의\n    - 루)차우셰스쿠 처형\n  - 베를린 장벽 붕괴 [필기: 1989] → 독일 통일 [필기: 1990]\n  - **⑭ 몰타 회담** [필기: +몰타]\n    - 냉전의 종식\n    - 미)부시 + 소)고르바초프\n- **1991**\n  - 독립 국가 연합 결성(CIS, 12.21) [필기: '민스크 협의']\n    - **⑮ 옐친** 주도 [필기: 러시아 공화국 대통령]\n  - 소련 붕괴(12.25)\n    - 고르바초프 소련 대통령직 사임\n  - ※ **소련 대통령**: 1990년 3월 15일부터 1991년 12월 25일까지 있었던 소련의 국가 원수\n\n![연표 · 지역 경제 통합 연표(1989~2016). 검은 화살표 연도 박스 1989·1992·1993·2016이 가로선 위에 배열되고, 1993](figures/fig-060-3.jpg)\n*그림 060-3 — 연표 · 지역 경제 통합 연표(1989~2016). 검은 화살표 연도 박스 1989·1992·1993·2016이 가로선 위에 대 영역(보라색), 파르티아의 최대 영역(붉은 선). 표기 지명: 콘스탄티노](figures/fig-063-3.jpg)\n*그림 063-3 — 지도 · ▲ 파르티아, 사산 왕조 — 범례: 사산 왕조 페르시아의 최대 영역(보라색), 파르티아의 최대 영역(붉은 선). 표기 지명: 콘스탄티노폴리스, 비잔티움 제국, 흑해, 카스피해, 지중해, 안티오크, 다마스쿠스, 예루살렘, 알렉산드리아, 아라비아반도, 크테시폰(★ 표시), 사산 왕조 페르시아, 수사, 페르세폴리스, 호르무즈 [필기: 크테시폰 주변에 보라색 표시, 캡션 아래 'S.P.']*\n\n<!-- leaf-064 -->\n### p.138\n\n## CHAPTER 01 페르시아 제국\n\n#### 2. 평가웅의 선택 – 평가원의 최신 기출 문항 Pick!\n\n**01** 밑줄 친 '제국'에 대한 설명으로 옳은 것은? <sub>2026학년도 6월</sub>\n\n> 바빌론을 중심으로 일어난 이민족 반란의 충격으로 **제국**이 통일을 이룬 지 한 세기가 채 못 되어 분열되자, 파라오 네코 2세는 이 틈을 타 시리아를 차지한 후 유프라테스강 유역으로 진출하며 새로운 대국 건설을 꿈꾸었다. 그러나 바빌론 반란군을 모체로 결성된 바빌로니아 군대에 유프라테스강 북쪽에서 완패하여 나일강 삼각주로 퇴각할 수밖에 없었다. 얼마 전 메디아 군대와 함께 **제국** 최후의 보루 하란성을 함락시켰던 바빌로니아 군대의 기세를 당할 수 없었던 것이다.\n\n[필기: '제국', '통일', '분열' 동그라미 / '제국' 옆에 화살표로 **아시리아**]\n\n① 쿠샨 왕조와 교역하였다.\n② 알렉산드리아를 건설하였다.\n③ 조로아스터교를 국교로 삼았다.\n④ 마라톤 전투에서 그리스 군대와 격돌하였다.\n⑤ 니네베를 수도로 삼고 왕립 도서관을 건립하였다. [필기: ⑤에 체크 표시 — 정답 표시]\n\n**02** (가) 왕조에 대한 탐구로 가장 적절한 것은? <sub>2024학년도 수능</sub>\n\n> '솔로몬의 잔'으로 알려진 이 유물의 중앙에는 **(가)** 의 샤한샤 **호스로 1세**가 묘사되어 있다. 그는 대내적으로 조세 제도와 군사 제도를 개혁하여 제국의 안정을 도모하였고, 대외적으로는 **수도 크테시폰**을 중심으로 적극적으로 영토를 확장하였다. 또한 인접국의 황제 **유스티니아누스**가 그리스 문화를 억압하는 가운데 아테네의 학교를 폐쇄하자, 이를 피해 온 학자들을 지원하여 학문 발달에 기여하였다.\n\n> [필기] (가) : S.P (네모 박스)\n\n① 맘루크 왕조가 멸망한 원인을 분석한다.\n② 카르타고 등 여러 도시가 건설된 배경을 조사한다.\n③ 마라타 동맹의 반란이 일어나게 된 계기를 파악한다.\n④ 왕의 눈이라 불리는 감찰관이 파견된 목적을 살펴본다.\n⑤ 선악의 대립을 교리로 하는 종교가 **국교화**된 과정을 알아본다. [필기: ⑤에 체크 표시, '국교' 동그라미]\n\n<!-- leaf-065 -->\n### p.143\n\n##### 1 이슬람교\n\n- **배경**\n  - 사산 왕조와 [① **비잔티움**] 제국의 대립으로 **동서 교역로 차단**, **새로운 교역로가 발달** [필기: 빈칸에 '비잔티움']\n  - 홍해와 아라비아해를 지나는 교역로 활성화 → **메카, 메디나** 등 해안도시 발달\n  - 도시 발달에 따라 빈부 격차 심화, 부족 간 갈등 심화\n- **메카 상인 무함마드**가 **알라를 유일신으로 하는 이슬람교 창시** [필기: 초록색 (610년경), '무함마드'·'알라' 동그라미]\n  - 헤지라(622): 메카 귀족의 박해를 피해 메디나로 피신, **이슬람력의 원년** [필기: '이슬람력의 원년' 동그라미]\n  - 메디나와 메카 장악, 아라비아 반도 대부분을 통일(630)\n\n> ※ 헤지라(622)\n> 헤지라는 아랍어로 '이주·도망'이라는 뜻으로 성스러운 이주라고도 한다. 622년 무함마드가 메카의 귀족들의 박해를 피해 이슬람 신도들과 함께 포교의 중심지를 메카에서 북쪽의 상업 도시인 메디나로 옮긴 일을 말한다. 헤지라가 단행된 해를 이슬람 원년으로 삼고, 종교·정치적인 이슬람 공동체(움마)를 건설하였으며, 무함마드는 정치·종교적 수장이 되었다.\n\n##### 2 이슬람 세계\n\n- **사회**\n  - **〈쿠란〉 중심**의 사회, 일부다처제, 돼지 고기 금기, **5행의 실천 중시** [필기: '쿠란' 동그라미, 초록색 '성지순례····']\n  - **지즈야(인두세)를 걷는 대신 피지배 민족의 종교 인정** [필기: '지즈야' 동그라미]\n- **경제**\n  - **상업** 행위를 긍정적으로 여겨 **자유로운 상업 활동 보장**\n  - 해로와 육로를 통한 **중계 무역** 발달 [필기: '중계' 동그라미]\n- **문화**\n  - 학문: 〈쿠란〉의 **번역 금지**로 **아랍어 발달**, 신학과 법학 발달 [필기: '쿠란' 동그라미]\n  - **지혜의 집: 아리스토텔레스 저술이 아랍어로 번역, 연구** [필기: 'in 바그다드']\n  - 문학: 〈아라비안 나이트〉\n  - 건축: 둥근 지붕(돔)과 아치, 뾰족한 탑을 특징으로 하는 **모스크 양식**, **아라베스크 무늬** [필기: 초록색 '↳ 우상숭배 X', 옆에 돔 모양 그림]\n- **자연 과학**\n  - 수학\n    - 인도에서 숫자 '**0**'의 개념 도입 → **아라비아 숫자** [필기: '0' 동그라미]\n    - **알 콰리즈미: 대수학의 아버지, 알고리즘의 어원** [필기: '알 콰리즈미' 동그라미]\n  - 화학\n    - **연금술 과정**에서 화학 발달\n    - **자비르 이븐 하이얀: 근대 화학의 아버지, 〈연금술에 대하여〉**\n  - **천문학: 지구 구형설을 설명**\n  - 의학\n    - **병원을 설립하고 병원의 시설 세분화**\n    - **이븐 시나: 이슬람 의학 집대성 〈의학전범〉**\n  - **중국의 제지법, 화약, 나침반 등을 유럽에 소개** [필기: '유럽에' 화살표 강조]\n\n<!-- leaf-066 -->\n### p.144\n\n## CHAPTER 02 이슬람 제국\n\n#### 3. 이슬람 제국\n\n**[② 정통 칼리프] 시대** [필기: 빈칸에 '정통 칼리프', 빨간 네모 '632~660', 연필 '7C']\n- 무함마드 사후 **칼리프 선출**\n  - **칼리프**: 이슬람 종교 지도자 [필기: '칼리프' 동그라미]\n- 이집트, 사산 왕조 정복\n- **4대 칼리프 알리 살해당함** [필기: '알리' 동그라미]\n  ↓\n- **시리아 총독 무아위야** [필기: 세모 강조]\n  - **우마이야 왕조 수립**\n\n> [필기] ① 아부바크르 ② 우마르 ③ 우스만 ④ 알리 (빨간색)\n> [필기] + 사.페 정복 (사산 페르시아 정복)\n\n**우마이야 왕조** [필기: 빨간 네모 '660~750']\n- 수도: [③ **다마스쿠스**] [필기: 빈칸 기입]\n- **카르발라의 참극** [필기: 화살괄호 강조]\n  - **칼리프 세습**\n  - **무아위야 → 야지드 1세 vs 알리의 차남 후세인 반란** [필기: 세모·동그라미 강조]\n  - 우마이야 군대가 반란 진압\n  - → **시아파(혈통) vs 수니파(능력)** [필기: '알리': 무함마드 혈통]\n- **이베리아 반도까지 진출** [필기: 연필 '이베리아 반도 우마이~']\n  - [④ **투르·푸아티에**] 전투(732) [필기: 빈칸 기입, 빨간색 '아브드 알 라흐만']\n    - 피레네 산맥 넘어 프랑크 공격 [필기: but lose...]\n    - vs 프랑크)마르텔 [필기: win]\n- **아랍인 우월주의 정책**\n  - 비아랍인의 불만\n  - → 멸망 by **아바스** 가문 + **시아파** [필기: 동그라미, 초록색 ': 아바스 혁명']\n\n**아바스 왕조** [필기: 빨간 네모 '750~1258', 초록색 '~수니파', 별표]\n- [⑤ **탈라스**] 전투 승리(751) [필기: 빈칸 기입, '751' 동그라미]\n  - vs **당** [필기: '당'에 X 표시] → 비단길 장악 [필기:  동쪽으로 카불 너머까지** 이르렀고, 수도는 알 만수르가 **원형의 계획도시**로 조성하였으며 '세계의 시장'이라 불렸다. 사절단은 코끼리를 포함하여 각종 진귀한 물품을 가지고 이듬해 아헨의 궁정에 도착하였다.\n\n[필기: '황제' 동그라미 + 화살표 '카·대'(카롤루스 대제) / '크리스트교 제국' 밑줄 + 화살표 '비잔티움' / '나라' 동그라미 + 화살표 '후우마이야' / '(가)의 영토는 ~ 카불 너머까지' 노란 형광펜 / '원형의 계획도시' 밑줄]\n\n① 발칸반도 대부분을 지배하였다.\n② 이스마일 1세에 의해 수립되었다.\n③ 코르도바를 중심으로 발전하였다.\n④ 훌라구에 의해 수도가 점령되었다. [필기: ④에 체크 표시 — 정답 표시]\n⑤ 우즈베크인의 침공으로 멸망하였다.\n\n**02** 밑줄 친 '이 왕조'에 대한 설명으로 옳은 것은? <sub>2024학년도 6월</sub>\n\n> 샤 루흐는 **이 왕조**의 개창자인 부친과는 여러모로 달랐다. 부친이 **몽골 제국의 계승**을 내세워 정통성을 확보하려고 하였다면, 그는 이런 바탕 위에 이슬람법에 기초한 통치 질서의 확대를 중시하였다. 또한 샤 루흐는 명 정벌을 시도한 부친과 달리 명과의 화친을 추구하여 사절단을 파견하였다. 이에 명의 영락제도 진성, 이달 등을 사절로 파견하여 샤 루흐 치세기에 양국 관계가 크게 개선되었다.\n\n① 사마르칸트를 수도로 삼았다. [필기: ①에 체크 표시 — 정답 표시]\n② 콘스탄티노폴리스를 점령하였다.\n③ 이산들와나 전투에서 승리하였다.\n④ 아바스 1세 때 전성기를 맞이하였다. [필기: 사파비]\n⑤ 이베리아반도까지 영토를 확장하였다. [필기: 우마이야]\n\n<!-- leaf-069 -->\n### p.151\n\n##### 1 오스만 제국 전근대사 [필기: ': 이슬람 (수니파)']\n\n**1299**\n- 튀르크계 오스만족\n- 아나톨리아 지역에서 건국 [필기: 초록색 '(소아시아 반도)']\n\n**1402**\n- **앙카라 전투 패배**\n  - [① **바예지드 1세**] [필기: 빈칸 기입]\n  - vs **티무르 제국** [필기: 동그라미]\n\n**메흐메트 2세**\n- **비잔티움 제국 정복(1453)** [필기: '1453' 동그라미]\n  - 콘스탄티노폴리스 [필기: X 표시]\n    - → **이스탄불**\n  - 성 소피아 대성당\n    - → 이슬람 사원 (미나렛 4개)\n\n**셀림 1세** [필기: 'VS 사파비 (이스마일 1세)', '〈찰디란 전투〉 1514', 분홍색 '→ 사파비의 서쪽 진출 억제']\n- **이집트 맘루크 왕조 정복(1517)** [필기: '1517' 동그라미]\n  - 칼리프 칭호 획득\n    - → **술탄·칼리프제** [필기: 초록색 ': 정교일치']\n    - → **메카·메디나의 보호자 자처**\n\n**술레이만 1세** [필기: '지원 : 바부르 (파니파트 전투, 1526)', '1526']\n- 헝가리 정복 [필기: 빨간색 '〈모하치 전투〉']\n- 오스트리아 빈 포위 공격 [필기: '→ but 실패']\n- [② **프레베자**] 해전(1538) **승리** [필기: 빈칸 기입, '승리' 동그라미]\n  - vs 유럽 연합 함대 [필기: 파란색 X 표시]\n  - → 지중해 해상권 장악 [필기: 동그라미]\n\n**셀림 2세**\n- **레판토 해전(1571) 패배** [필기: '1571'·'패배' 동그라미]\n  - vs **유럽 연합 함대** [필기: 파란색 동그라미] / 에)(펠리페 2세) [필기: 초록색 '신성동맹']\n\n**통치** [필기: 파란색 '시파히: 기병']\n- [③ **티마르**] 제도 [필기: 빈칸 기입, 초록색 '≒절도사', 분홍색 '(당나라)']\n  - 지방의 기병에게 티마르(토지 징세권) 부여\n  - 그 대가로 말과 무기를 갖추어 전쟁 참여\n- [④ **데브시르메**] 제도 [필기: 빈칸 기입, '✝ → C☾' (크리스트교 → 이슬람)]\n  - **크리스트교 청소년 개종**\n- [⑤ * (figures/fig-072-2.jpg)\n*그림 072-2 — 지도 · ▲굽타 왕조*\n![지도 · ▲델리 술탄 왕조](figures/fig-072-3.jpg)\n*그림 072-3 — 지도 · ▲델리 술탄 왕조*\n![사진 · ▲쿠와트 알 이슬람 모스크(쿠트브 미나르)](figures/fig-072-4.jpg)\n*그림 072-4 — 사진 · ▲쿠와트 알 이슬람 모스크(쿠트브 미나르)*\n\n<!-- leaf-073 -->\n### p.165\n\n*(쪽 하단 러닝헤드: Part VI 인도 지역의 역사)*\n\n*(연표형 가로 흐름: 굽타 왕조 → 이슬람 전파 → 델리 술탄 왕조, 그 아래 무굴 제국)*\n\n**굽타 왕조** [필기: 힌두교 →] [필기: 굽아가타 (판독불확실)] [필기: 4~6C]\n- 찬드라굽타 1세 건국\n- 찬드라굽타 2세 전성기\n- **쇠퇴** by [⑦ **에프탈**] 침략 [필기]\n- 수도 : 파탈리푸트라 [필기: 줄 전체가 손글씨]\n- **인도 고전 문화의 황금기**\n  - 인도 고유의 특색 강조\n  - **산스크리트 문학**\n    - 칼리다사의 희곡 〈샤쿤탈라〉\n    - 서사시 〈마하바라타〉, 〈라마야나〉\n  - 힌두교\n    - 브라만교 바탕으로 다양한 신앙 융합\n    - 브라흐마, 비슈누, 시바 등 **다신교**\n    - 〈마누 법전〉\n  - **굽타 양식**\n    - **간다라 양식 + 인도 고유 특색**\n    - **아잔타 석굴, 엘로라 석굴, 날란다 사원**\n  - 굽타 과학\n    - **영(0), 10진법, 수학, 천문학** 등 발달\n\n**이슬람 전파** [필기: → 이슬람]\n\n**가즈니 왕조**\n- 10c 후반 펀자브 지역\n- 아프가니스탄의 튀르크족\n\n**구르 왕조** [필기: (고르 왕조)]\n- 12c 인도 침입\n  - 북인도 지배\n\n**델리 술탄 왕조**\n- [⑧ **아이바크**] 수립 [필기] [필기: 아파트]\n  - 구르 왕조 무함마드의 **노예(맘루크)** 출신\n  - 수도: **델리**\n  - [⑨ **쿠트브 미나르**] 건설 [필기]\n- **200여년 동안 다섯 왕조 교체**\n  - 아이바크-할지-투글라크-사이이드-**로디**\n- 관용 정책\n  - **지즈야를 납부하면 다른 종교 인정**\n  - 이슬람교로 개종 증가\n\n[⑩ **촐라**] 왕조(남인도 지역) [필기] [필기: 9C~13C 번영.]\n- 데칸 고원 이남의 타밀 지역\n- **9세기~13세기까지 번영** [필기: (이전에도 존재는 O)]\n- **힌두교 왕이 지배, 힌두 문화가 동남아로 전파**\n- **중계 무역 발달(중국-동남아-서아시아)** [필기: 중국 → 송(북,남)→원 / 동남아 → 스리비자야 / 서아시아 → └ 아바스 왕조]\n\n**무굴 제국**\n- **바부르** 건국(티무르 후손) [필기: 칭기스칸] [필기: 그 몽골의 후예의 후예!] [필기: 왕의 후예 (판독불확실)]\n- ☆ [⑪ **파니파트**] 전투(1526) 승리 [필기] [필기: 오.제국 술레이만 1세 지원]\n  - vs 로디 왕조(이브라힘 로디)\n- 수도 : 델리 → 아그라 [필기: 줄 전체가 손글씨]\n- **아크바르**(3대 황제) [필기: 악바르]\n  - 바부르①-후마윤②-아크바르③-자한기르④ [필기: 각 이름 위에 ①②③④ 순번]\n  - 데칸 고원 이남 제외 인도 통일\n  - **관용적 종교 정책**\n    - **지즈야(인두세) 폐지**\n    - 힌두교도 차별 없이 관료 임명\n    - **라지푸트족(힌두교)과 혼인**\n- **샤자한**(5대 황제) [필기: ⑤]\n  - 타지마할 건축\n    - 뭄타즈 마할 추모 묘당\n- [⑫ **아우랑제브**](6대 황제) [필기] [필기: ⑥]\n  - **데칸고원 넘어 최대 영토 확보**\n  - 이슬람 제일주의\n    - **지즈야(인두세) 부활**\n  - vs **마라타족 반란**(인도 중부 지역) [필기: (힌두교)] [필기: 지도자 : 시바지]\n 기: 크리스트교(대진사)] [필기: 하르샤 왕국]\n  - 이백, 두보와 같은 시인 활약\n  - **[⑭ 당삼채]**: 화려하고 이국적인 도기 [필기] [필기: 당삼채 (漢?)]\n\n> **기미 정책**\n> 기(羈)는 말의 굴레, 미(縻)는 소의 고삐라는 뜻으로, 중국이 이민족을 **간접 지배**하던 정책이다. 태종과 고종은 복속 지역에 **도호부**를 설치하여 중앙에서 **책임자를 파견**하는 동시에 해당 지역의 **왕**을 지방관으로 임명하는 기미 정책을 실시하였다\n\n<!-- leaf-082 -->\n### p.182\n\n\n#### 4 평가옹의 선택 – 평가원의 최신 기출 문항 Pick!\n\n> MEMO (좌측 여백 메모란, 비어 있음)\n\n**01** (가) 왕조에서 있었던 사실로 옳은 것은?  (2026학년도 수능)\n\n> ＿(가)＿ 은/는 처음에 사방의 이민족을 살필 여유가 없었다. 그런데 **동돌궐을 복속**한 이래로 탕구트, 설연타 등 주변 민족이 점점 복속해 오자, 그들이 원래 살고 있던 지역에 주와 현을 설치하였다. 그 가운데 큰 것을 **도독부**라고 하고, 그 수령을 도독 및 자사로 삼았으며 모두 세습을 허용하였다. 이러한 주와 현은 대부분 호부에 세금을 납부하거나 호적을 보고하지 않았지만, 황제의 덕이 미치는 곳은 변주 도독이 다스렸다. **이민족에 대한 이러한 통치 방식은 마치 고삐로 소와 말을 잡아끄는 이치와 같았다.**\n> [필기: → 주현제 = 군현제] [필기: ㄴ 기미 정책]\n\n- ① 자금성이 축조되었다. [필기: 명]\n- ② 9품중정제가 시행되었다. [필기: 위진남북]\n- ③ 안사의 난이 발생하였다. [필기: 정답 체크 표시 √, a]\n- ④ 청명상하도가 제작되었다. [필기: 송]\n- ⑤ 만한 병용제가 실시되었다. [필기: 청]\n\n> [필기] 당 태종 (동그라미)\n\n**02** 밑줄 친 '**황제**'의 업적으로 옳은 것은?  (2024학년도 수능)\n\n> - 『시경』, 『서경』, 백가 서적을 불태운 참화가 매서웠으나 박사관에 소장된 서적들은 온전히 **보존**되었다. 박사관의 서적들이 모두 사라진 것은 **항우**가 궁궐에 **불을 질렀기** 때문인데도, 후세 사람들이 오직 **황제만 책망하는 것은** 어째서인가?\n> - 유생들을 **생매장**한 일은 진실로 포악한 행위였다. 그러나 황제가 **6국을 멸하여 천하를 이미 통일**하였는데도, 유생들이 여전히 자신들의 생각을 퍼뜨리며 백성들 사이에서 권세를 취하고 있었으니 어찌 화를 당하지 않을 수 있었겠는가?\n\n> [필기] ㄴ (진) 시황제.\n\n- ① 양세법을 시행하였다. [필기: 당 덕종]\n- ② 9품중정제를 실시하였다. [필기: 위진 남북조]\n- ③ 과거제에 전시를 도입하였다. [필기: 송 태조]\n- ④ 통제거 등 대운하를 건설하였다. [필기: 수 양제]\n- ⑤ 흉노를 몰아내고 만리장성을 쌓았다. [필기: 정답 체크 표시 √, a]\n\n(하단 좌측: 182 반가옹 세계사 개념 완성)\n\n<!-- leaf-083 -->\n### (쪽번호 없음)\n\n**MEMO**\n\n(줄만 그어진 빈 메모 쪽 — 필기 없음)\n\n<!-- leaf-084 -->\n### p.188\n\n## CHAPTER 02 [중국사] 송 ~ 원\n\n**[계통 흐름도]** 당 멸망 → 5대 10국 → 송 / 거란(요) / 서하 (가로 연결선으로 이어짐)\n\n- **거란(요)** [필기: f(기트)? (판독불확실)]\n  - **[⑥ 야율아보기]** 건국 [필기: (916)]\n  - 발해 정복\n  - **[⑦ 연운 16주]** 획득\n    - from. 후진) 석경당\n  - 수도: **[⑧ 상경 임황부]** [필기: (야율덕광)]\n  - **북면관제 남면관제** [필기: (이중지배체제)]\n    - 북추밀원, 남추밀원\n    - 남면관제: 3성 6부로 구성\n  - 거란 문자 제정\n  - **[⑨ 전연의 맹]**(1004) [필기: 전연~]\n    - 송이 요에 매년 은 10만냥, n\n## CHAPTER 03 [중국사] 명 ~ 청\n\n#### 1 내용 확인\n\n**[계통 흐름도]** 원 → 명\n\n- **원**\n  - 원 쇠퇴\n    - 황실 내분\n    - 교초 남발\n    - 홍건적의 난 [필기: (백련교)]\n\n- **명**\n  - 홍무제(태조)\n    - 홍건적 출신 **[① 주원장]**\n    - 수도: **[② 난징]**\n    - 황제권 강화\n      - 재상제 폐지 [필기: 보라색 X 표시]\n      - 황제가 6부 직접 관할\n    - 성리학 관학화\n    - 육유 제정, 반포\n    - **[③ 이갑제]** [필기: 이장호 / 갑수호]\n      - 향촌 관리, 세금 징수\n    - 어린도책(토지 대장) [필기: (물고기 비늘)]\n    - 부역황책(호적 대장)\n    > [필기] cf) ≠ 보갑제 [왕안석] / 청 → 강건성세 [필기: 강(희)·건(륭)]\n  - **[④ 영락제]**(태종) [필기: 여베(태양)? (판독불확실)]\n    - '연왕' 주체 [필기: ㄴ 정강의 변(송)]\n    - **[⑤ 정난의 변]**으로 즉위\n    - **[⑥ 베이징]**으로 천도\n    - 자금성 건설\n    - 내각 대학사 설치\n    - **[⑦ 정화]**의 원정 [필기: 7차까지]\n      - 정화는 무슬림, 환관\n      - 조공 질서 확대\n    - 몽골 원정, 대월 정복 [필기: 지배 X]\n    - 일본 책봉, 감합 무역\n    - 대규모 편찬 사업 [필기: ––대전] 〈영락대전〉, 〈사서대전〉\n\n- **〈북로남왜 시기〉** [필기: 16C]\n  - 물자 획득을 위해 중국을 침략\n    - 북: 몽골족(오이라트, 타타르)\n    - 남: 왜구\n    - ↓\n    - 환관에 의한 정치 혼란\n    - 북로남왜로 인한 재정 악화\n  - **[⑧ 장거정]**의 개혁(만력제) [필기: 명 신종]\n    - 토지 조사, 일조편법 실시\n    - **일조편법: 지세, 정세를 은으로 징수** [필기: 양세법 →]\n      - ↓ [필기: ·몽골과 화의(교역 허용) (판독불확실)]\n  - 환관의 정치 개입과 당파 싸움\n  - 임진왜란 참전으로 재정 악화\n\n#### 명·청 경제, 사회, 문화\n\n| 경제 | 항목 | 내용 |\n|---|---|---|\n| 경제 | 농업 | · 명대: 창장강 **중류** 곡창 지대<br>· 청대: 창장강 **상류** 곡창 지대<br>· **고구마, 감자, 담배** 등의 외래 작물 전래 |\n| 경제 | 상공업 | · 창장강 **하류** 수공업 중심지로 발달(시진 발달)<br>· **산시 상인, 휘저우 상인** 등의 대상인 등장<br>· **동향** 조직(**회관**), **동업** 조합(**공소**) 결성 |\n| 경제 | 무역 – 명 | · **왜구 창궐로 인해 해금 정책 실시**<br>　– 조공 무역, **감합** 무역(무로마치 막부) 허용 |\n| 경제 | 무역 – 청 | · **반청 운동으로 인해 해금 정책(천계령) 실시**<br>　– 타이완 정씨 세력 진압 후에는 해금 해제<br>· **건륭제: 광저우 무역 체제**<br>　**광저우에서 공행을 통해서만 무역 허용** [필기: 별표★] |\n\n| 사회 | 내용 |\n|---|---|\n| **신사층** 성장 | · 학교 + 과거제 결합<br>· 지방의 행정 업무 담당 |\n| 서민 의식 성장 | · 서민 교육 확대<br>· 직용의 변(직공들의 투쟁)<br>· 노변(노복의 신분 해방 요구) |\n\n| 은 경제 | 내용 |\n|---|---|\n| 은 경제 | · 이슬람 상인의 활동, 서양 상인의 진출<br>· 전세계의 은이 중국으로 유입 → 조세 은납화<br>　– **명)일조편법: 정세와 지세를 따로 은으로 징수**<br>　– **청)지정은제: 정세를 지세에 포함, 은으로 징수** |\n\n(하단 좌측: 198 반가옹 세계사 개념 완성)\n\n<!-- leaf-089 -->\n### p.199\n\n(쪽 상단에 겹쳐 놓인 별도 인쇄물 — 옹정제 비밀 상주문 설명)\n\n> 옹정제의 \\*\\*비밀 상주문(密折, 밀절)\\*\\*은 쉽게 말하면 신하가 황제에게 비밀리에 직접 보고하는 제도야.\n> - 상주문: 신하가 황제에게 올리는 보고서\n> - 비밀 상주문: 다른 관료들이 내용을 알 수 없게 황제에게 직접 밀봉해서 보고\n> - 옹정제는 이를 적극적으로 활용해서 지방관의 업무, 다른 관료들의 행동, 민심 등을 황제에게 직접 보고받았어.\n> - 황제는 이 정보를 이용해서 관료들을 서로 감시하게 하고 중앙집권을 강화했지.\n>\n> **수능식으로 기억하면**\n> **옹정제 → 비밀 상주문 → 관료 감시·정보 수집 → 황제 권력 강화**\n>\n> 특히 청나라의 군기처와 함께 나오면 옹정제가 황제 중심의 통치를 강화했다는 맥락으로 보면 돼.\n\n(좌측 세로 띠 상자: **임진왜란**)\n\n**[계통 흐름도]** 후금 → 청 (명의 '멸망'으로 이어지는 선, 노란 형광펜 표시)\n\n- **후금**\n  - 누르하치 [필기: 1616]\n    - 팔기제 [필기: 만주 + 몽골 + 한족 → 24기]\n- **청**\n  - 홍타이지 [필기: → 태종]\n    - 칭제건원 [필기: 1636]\n    - 조선 침략\n      - 후금) 정묘호란\n      - 청) 병자호란\n  - 순치제\n    - 베이징 입성 [필기: 1644]\n  - **[⑨ 강희제]** [필기: (1661~1722)]\n    - 삼번의 난 진압\n      - 오삼계 등 한족 반란\n    - 타이완의 반청 세력 진압\n      - 타이완 정성공 세력 [필기: (정씨 세력)]\n    - 네르친스크 조약(1689)\n      - 러)**[⑩ 표트르]** 대제\n    > [필기] 정지룡 – 정성공 – 정경 – 정극상\n  - **[⑪ 옹정제]** [필기: 판독불확실 초록 메모]\n    - 군기처 설치 [필기: + 지정은제 실시]\n      - 황제권 강화\n    - 비밀 상주문제\n    - 금교령 [필기: 크리스트교 금지]\n  - **[⑫ 건륭제]** [필기: '십전노인']\n    - 최대 영토 확보 [필기: 몽골, 티베트, 신장(위구르) → 번부(간접통치)]\n    - 〈사고전서〉 편찬\n    - 영)매카트니 사절단 [필기: + 공행 설치 : 광저우 무역 체제(공행)]\n  - 백련교의 난 [필기: (1796~1804)]\n    - 건륭제 퇴위 후 발생\n\n- **멸망**(명)\n  - 이자성의 난\n    - 농민 봉기\n    - [필기: (명) — '순치제'에 빨간 X 표시로 정정]\n\n#### 청의 한족 통치\n\n- 강경책\n  - **만주족 풍습 강요**\n    - 변발, 호복\n  - 사상 탄압\n    - **문자의 옥**\n- 회유책\n  - 대규모 편찬 사업 [필기: 고증학 발달]\n    - 옹〈고금도서집성〉\n    - **건〈사고전서〉**\n  - **만한병용제**\n\n> **팔기군(팔기제)** [필기: 별표★]\n> 누르하치가 조직한 **군사 조직이자 행정 조직**이다. 팔기는 황·백·홍·남색의 **4기**와 그것에 테두리를 두른 **4기**를 더하여 **8기**이며, 후에는 만주족 이외에 몽골족과 한족도 팔기에 편성되었다. 팔기의 병사들은 특별한 호적에 등재되어 각종 특권을 누렸고 토지를 받았다.\n\n| 학문 | 내용 |\n|---|---|\n| 명 | · **[⑬ 양명학]**<br>　– 왕수인(왕양명), 심즉리, 지행합일, 평등 주장<br>· 실학: 〈본초강목〉, 〈농정전서〉, 〈천공개물〉 |\n| 청 | · **고증학**<br>　– 고전을 실증적으로 연구, 대규모 편찬 사업 계기 |\n\n| 서민 문화 | 내용 |\n|---|---|\n| 명 | · 〈삼국지연의〉, 〈서유기〉, 〈수호전〉 |\n| 청 | · 〈**[⑭ 홍루몽]**〉, 〈유림외사〉, 경극 |\n\n**서양 문물의 전래** — · 명 말 예수회 선교사의 활약\n\n| 인물 | 내용 |\n|---|---|\n| 마테오 리치 | · 〈**곤여만국전도**〉: 세계 지도 제작<br>· 〈**[⑮ 기하원본]**〉 번역 with 명)서광계 [필기: 기계]<br>· 〈천주실의〉 저술 |\n| 아담 샬 | · 〈**[⑯ 시헌력]**〉: 역법 개정<br>· 흠천감(천문 관측) 책임자로 활동 |\n| 카스틸리오네 | · **서양 원근법과 음영법 소개**<br>· 건륭제의 초상화를 그림 |\n| 전례 문제 | · 로마 교황청에서 중국의 전통(제사)을 인정하는 문제로 발생 [필기: when 인종 (판독불확실)]<br>· 황실에 봉사하는 선교사 제외 모두 추방 |\n\n(하단 우측: Part VII 중국사 199)\n\n<!-- leaf-090 -->\n### p.200\n\n\n#### 2 평가옹의 선택 – 평가원의 최신 기출 문항 Pick!\n\n> MEMO (좌측 여백 메모란, 비어 있음)\n\n**01** (가)에 들어갈 내용으로 가장 적절한 것은?  (2025학년도 수능)\n\n> 무역 활동이 확대되면서 서양 상인들이 유리한 무역 조건을 찾아 지정된 남쪽의 항구를 벗어나 닝보 등으로 북상하는 경우가 많아졌다. 황제는 효율적으로 무역을 통제하기 위하여 민절총독 양응거의 건의를 받아들여 서양 상인과의 **무역을 광저우 한 곳으로 제한**하였다. 영국인 제임스 플린트가 황제에게 광둥성 해관의 부패와 불량한 태도를 고발하고 북쪽 연안의 더 많은 항구에서 서양 상인이 무역 활동을 할 수 있도록 허용해 줄 것을 요구하였지만 황제는 이를 허락하지 않았다. 이러한 상황에서 서양 상인과의 **무역을 관리하기 위해** ＿(가)＿\n> [필기: '광저우'에 빨간 동그라미, '무역을 ~ 제한하였다'와 '무역을 관리하기 위해'에 빨간 밑줄]\n\n- ① 공행을 운영하였다. [필기: 정답 체크 표시 √]\n- ② 시박사를 설치하였다.\n- ③ 회관, 공소를 건립하였다.\n- ④ 시역법 등 신법을 단행하였다.\n- ⑤ 색목인을 재정 관료로 등용하였다.\n\n> [필기] 건륭제\n\n**02** 밑줄 친 '**이 왕조**'의 경제 상황으로 옳은 것은?  (2025학년도 수능)\n\n> **이 왕조**는 호적·조세 대장에 따라 세금을 부과하고 **이장호**와 **갑수호**가 징수와 납입을 책임지는 세제를 추진하였다. 그런데 세금 항목이 무원칙적으로 늘어나 복잡해지고 백성들이 세금을 체납하거나 회피하는 일이 많아졌다. 이에 **주·현**의 잡다한 항목의 세금을 지세와 정세로 통합하여 지세는 보유 토지에 따라, 정세는 성년 남자의 수에 따라 은으로 할당해 납부하도록 하는 세제를 시행하였다. 이 세제는 가정, 융경 연간 부분적으로 시행되다가 만력 연간 내각 수보 대학사의 주도로 전국적으로 확대 실시되었다.\n> [필기: '이장호', '갑수호'에 빨간 동그라미, '주·현'에 빨간 밑줄]\n\n- ① 지정은제가 실시되었다. [필기: X 청]\n- ② 반량전으로 화폐가 통일되었다. [필기: 진]\n- ③ 균수법과 평준법이 시행되었다. [필기: X → 한 무제]\n- ④ 영제거 등 대운하가 건설되었다. [필기: X 수 양제]\n- ⑤ 북로남왜로 인해 재정난이 가중되었다. [필기: 정답 체크 표시 √, O, 16C]\n\n> [필기] 명 (빨간 동그라미) / 명, 이갑제 (동그라미)\n\n(하단 좌측: 200 반가옹 세계사 개념 완성)\n\n<!-- leaf-091 -->\n### (쪽번호 없음)\n\n**MEMO** (인쇄된 메모지 양식, 이하 전부 학생 필기)\n\n> [필기] 한개의 태이양, 똥의 광신도\n> [필기] 1차 아편 (1840-42)\n> [필기] 태평천국 (1851-64) : 멸만흥한\n> [필기] 2차 아편 (1856-60)\n> [필기] 양무운동 (1861-94) : 중체서용\n> [필기] 변법자강 (1898) :\n> [필기] 의화단 (1899-1901) ∴ 부청멸양\n> [필기] 광서신정 (1901-1908)\n> [필기] 신해혁명 (1911) → 중화민국 (1912)\n> [필기] 신문화 (1915)\n> [필기] ↓\n> [필기] 5·4운동 (1919)\n\n(나머지 줄은 빈칸)\n\n<!-- leaf-092 -->\n## CHAPTER 04 [중국사] 근현대사\n### p.206\n\n> [필기] 일·태·이·양· 변·의·광·신\n> [필기, 형광펜] 한개의 태이양, 똥의 광신도\n\n#### 1. 개항기 ~ 일본 패망\n\n**[영국]삼각무역**\n\n> [필기] (삼각무역 도식) 영 ←(차·도자기)— 청, 영 → 청, 인도 → 영, 인도 → 청(아편), 청 → 인도 방향 화살표. 화살표 위 표기: 차·도자기 / 아편\n\n- 영)아편 밀수출\n- 청)아편 단속, **임칙서** 파견 [필기: (흠차대신)]\n- ↓\n- 영국의 **반발**\n- ↓\n\n**제1차 아편 전쟁(1840~42)**\n\n- **영국**의 공격, **승리**\n- ↓\n- [① **난징조약**] (1842) [필기]\n- 5개 항구 개항 [필기: 광저우, 샤먼, 푸저우, 닝보, 상하이 — 광저우 위에 '남', 상하이 위에 '북' 표기]\n  - **광저우, 상하이** 등 [필기: 개항 남 / 북]\n- [② **공행**] 폐지 [필기]\n- 영국에 [③ **홍콩**] 할양 [필기] [필기: (섬)]\n- 추가 조약(후먼 조약)\n  - **영사 재판권 인정**\n  - **최혜국 대우 인정**\n  - **관세 자주권 상실**\n\n**태평천국 운동(1851~64)**\n\n- 배경\n  - 아편전쟁 이후 물가 상승, 조세 부담 증가\n- [⑨ **홍수전**] 주도 [필기]\n  - **'배상제회' 조직**\n  - '[⑩ **멸만흥한**]'을 내걸고 봉기 [필기]\n  - **태평천국 왕조 수립, [⑪ 난징(천경)] 수도** [필기]\n  - **천조전무 제도를 통해 토지 균분 주장**\n  - 남녀 평등, 전족 폐지 등의 개혁 주장\n- 진압\n  - **증국번, 이홍장** 등 **한인 신사 관료층** (향용, **단련** 조직)\n  - **상승군**이라 불린 **서양 열강 세력의 개입**\n\n**제2차 아편 전쟁(1856~60)**\n\n- 배경\n  - 영국의 무역 확대 의도\n  - 영)[④ **애로호**] 사건(1856) [필기]\n    - 영국 국기 모독 사건\n  - **프)선교사 탄압, 처형**\n- 영·프 연합군의 침입 → 청 패배\n- ↓\n- [⑤ **톈진**] 조약(1858) [필기]\n- **10개 항구 추가 개항**\n  - 난징, 한커우, 잉커우 등\n- **크리스트교 포교 자유 허용**\n- **외교관의 베이징 주재 허용**\n- ↓\n- 청 황제의 **비준** 거부\n\n> [필기, 초록색] ※조인 : 사인\n> [필기, 초록색] ※비준 : 실시\n\n- → **영·프 연합군의 침입**\n- → **베이징 함락**\n- [⑥ **베이징**] 조약(1860) [필기]\n- **러시아의 중재**\n- **톈진 조약 비준** [필기: 이제 시행 (판독불확실)]\n- **톈진 추가 개항**\n- **영국에 [⑦ 주룽반도] 할양** [필기]\n- **러시아에 [⑧ 연해주] 할양** [필기]\n\n> [필기] (본문 아래 여백에 볼펜 낙서 그림)\n\n**양무 운동(1861~94)** [필기: 우~33 (판독불확실)]\n\n- 배경\n  - 아편전쟁과 태평천국 운동 진압 과정에서 서양 무기의 **우수성 절감** [필기: 절실히 느낌.]\n- 내용\n  - **증국번, 이홍장 주도**\n  - '[⑫ **중체 서용**]' 표방 [필기]\n  - 서양식 무기와 군함 도입\n  - **금릉 기기국 등의 군수 공장 설립** [필기: (난징) / in 난징]\n  - 기선 회사, 방직 공장 등 근대적 기업 설립\n- 한계\n  - 중앙 정부의 체계적 지원 부족\n  - 양무파 내부의 분열\n  - **청프 전쟁과 청일 전쟁 패배로 한계 드러남**\n- ※ **청프 전쟁(1884~85)**\n  - 베트남 종주권을 두고 프랑스와 전쟁, 패배\n\n> [필기] ＊청일 전쟁 (1894~95) ↳ 시모노세키 조약\n\n![지도 · 태평천국 운동](figu   pg.lines.forEach((ln, li) => {
    const t = ln.t;
    if (ln.h || t.startsWith('![') || t.startsWith('*그림') || t.startsWith('<!--') || /^\|\s*-+/.test(t)) return;
    const bolds = [...t.matchAll(BOLD)].map(x => x[1].trim()).filter(b => !SKIP_BOLD.test(b));
    bolds.forEach((ans, bi) => {
      // 답을 빼면 남는 글자가 없고 윗줄 맥락도 없으면(장식 띠, 단독 제목 줄) 문제가 성립하지 않으니 제외
      const rest = t.replace('**' + ans + '**', '').replace(BOLD, '$1').replace(/[^가-힣A-Za-z0-9]/g, '');
      if (rest.length < 2 && (!/^\s*[-*]\s/.test(t) || (!ln.sec && !ctxLines(pg, li).length))) return; // 통째로 굵은 줄: 목록 항목이면 소제목·윗줄이 맥락, 아니면(소제목 띠·연대 표시) 제외
      questions.push({ id: pg.leaf + ':' + li + ':' + bi, pg, li, ans, text: t, sec: ln.sec, unsure: /판독불/.test(t) });
    });
  });
}
chapters.forEach(c => { c.qs = questions.filter(q => q.pg.ch === c); c.pool = [...new Set(c.qs.map(q => q.ans))]; });

// ---------- 표시용 변환 ----------
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function inline(s, blankAns) {
  let done = false;
  let h = esc(s.replace(/^\s*[-*]\s+|^>\s*/, '').replace(/^\|(.*)\|$/, (m, c) => c.split('|').map(x => x.trim()).filter(Boolean).join(' · ')));
  h = h.replace(/\*\*([^*]+)\*\*/g, (m, b) => {
    if (blankAns !== undefined && !done && b.trim() === esc(blankAns)) { done = true; return '<span class="blank" id="blank">&nbsp;</span>'; }
    return blankAns !== undefined ? '<b>' + b + '</b>' : '<b>' + b + '</b>';
  });
  h = h.replace(/\(판독불확실[^)]*\)|\(판독불가\)/g, m => '<span class="badge">' + m.slice(1, -1) + '</span>');
  h = h.replace(/\[필기:?[^\]]*\]/g, m => '<span class="note">' + m + '</span>');
  h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
  return h;
}
// 윗줄 맥락: 상위 항목(들여쓰기 얕은 줄) 최대 2줄 + 바로 앞 형제 줄. 한 줄 전체가 굵은 글씨인 문제가 빈칸만 남지 않게.
function ctxLines(pg, li) {
  const ind = t => t.match(/^\s*/)[0].length;
  const cur = ind(pg.lines[li].t); let out = [], lim = cur, sib = false;
  for (let i = li - 1; i >= 0 && out.length < 3; i--) {
    const l = pg.lines[i], t = l.t;
    if (l.h) break;
    if (!t.trim() || /^(!\[|\*그림|<!--|\|\s*-)/.test(t)) continue;
    if (ind(t) < lim) { out.unshift(t); lim = ind(t); }
    else if (!sib && ind(t) === cur) { out.unshift(t); sib = true; } // 바로 앞 형제 줄 하나(빈 줄·화살표 줄 건너뜀)
  }
  return out;
}
function pageHtml(pg) {
  let out = '', inTable = false;
  for (const ln of pg.lines) {
    const t = ln.t;
    if (!t.trim() || t.startsWith('<!--')) { if (inTable) { out += '</table>'; inTable = false; } continue; }
    if (ln.h) { out += '<h4>' + esc(t.slice(5)) + '</h4>'; continue; }
    const fig = t.match(/^!\[([^\]]*)\]\(([^)]+)\)/);
    if (fig) { out += '<img src="' + (FIGS[fig[2]] || fig[2]) + '" alt="' + esc(fig[1]) + '" loading="lazy">'; continue; }
    if (t.startsWith('*그림')) { out += '<div class="cap">' + esc(t.replace(/^\*|\*$/g, '')) + '</div>'; continue; }
    if (t.startsWith('|')) {
      if (/^\|\s*-+/.test(t)) continue;
      if (!inTable) { out += '<table>'; inTable = true; }
      out += '<tr>' + t.slice(1, -1).split('|').map(c => '<td>' + inline(c.trim()) + '</td>').join('') + '</tr>'; continue;
    }
    if (inTable) { out += '</table>'; inTable = false; }
    const ind = Math.min(4, Math.floor((t.match(/^\s*/)[0].length) / 2));
    out += '<p style="padding-left:' + ind * 1.1 + 'em">' + inline(t) + '</p>';
  }
  return out + (inTable ? '</table>' : '');
}

// ---------- 진도 저장 ----------
let prog = {}; // qid -> [ok, ts]
try { prog = JSON.parse(localStorage.getItem('prog') || '{}'); } catch {}
const remoteSave = initProgress(d => { prog = Object.assign({}, prog, d); renderStats(); renderSide(); renderStrip(); });
function save(qid, ok) {
  prog[qid] = [ok ? 1 : 0, Date.now()];
  try { localStorage.setItem('prog', JSON.stringify(prog)); } catch {}
  if (remoteSave) remoteSave(prog);
}

// ---------- 화면 ----------
const $ = id => document.getElementById(id);
let cur = null, curQ = null, queue = [], wrongOnly = false;
const pct = c => { const done = c.qs.filter(q => prog[q.id]); return done.length ? Math.round(100 * done.filter(q => prog[q.id][0]).length / done.length) : null; };
function renderSide() {
  const s = $('side'); s.innerHTML = '<h1>반가옹 세계사 노트</h1>';
  chapters.forEach((c, i) => {
    const b = document.createElement('button'); b.className = 'ch' + (c === cur ? ' on' : '');
    const p = pct(c), n = c.qs.filter(q => prog[q.id]).length;
    b.innerHTML = '<span>' + esc(c.title.replace(/^CHAPTER \d+ /, '')) + '</span><em class="mono' + (n === c.qs.length ? ' done' : '') + '">' + (p === null ? '—' : p + '%') + '</em>';
    b.title = c.title + ' · ' + n + '/' + c.qs.length + ' 문제';
    b.onclick = () => start(c, false); s.appendChild(b);
  });
  const sep = document.createElement('div'); sep.className = 'sep'; s.appendChild(sep);
  const w = document.createElement('button'); w.className = 'ch' + (wrongOnly ? ' on' : '');
  w.innerHTML = '<span>오답 노트만 풀기</span><em class="mono">' + questions.filter(q => prog[q.id] && !prog[q.id][0]).length + '</em>';
  w.onclick = () => start(cur || chapters[0], true); s.appendChild(w);
  const t = document.createElement('div'); t.className = 'tool'; t.textContent = '문제 ' + questions.length + '개 · 교재 굵은 글씨 그대로'; s.appendChild(t);
}
function renderStats() {
  const day = new Date().toDateString();
  const all = Object.values(prog);
  $('kToday').textContent = all.filter(v => new Date(v[1]).toDateString() === day).length;
  $('kAcc').innerHTML = (all.length ? Math.round(100 * all.filter(v => v[0]).length / all.length) : '—') + '<i>%</i>';
  $('kWrong').innerHTML = all.filter(v => !v[0]).length + '<i>개</i>';
}
function renderStrip() {
  const s = $('strip'); s.innerHTML = '';
  if (!cur) return;
  cur.pages.forEach(pg => {
    const qs = cur.qs.filter(q => q.pg === pg); if (!qs.length) return;
    const done = qs.filter(q => prog[q.id]).length;
    const b = document.createElement('button');
    b.className = (curQ && curQ.pg === pg ? 'cur ' : '') + (done === qs.length ? 'done' : done ? 'some' : '');
    b.textContent = pg.label; b.title = done + '/' + qs.length; b.onclick = () => openPage(pg); s.appendChild(b);
  });
}
function start(c, wrong) {
  cur = c; wrongOnly = wrong;
  try { localStorage.setItem('ch', chapters.indexOf(c)); } catch {}
  const base = wrong ? questions.filter(q => prog[q.id] && !prog[q.id][0]) : c.qs;
  const fresh = base.filter(q => !prog[q.id]), rest = base.filter(q => prog[q.id]);
  const shuf = a => a.sort(() => Math.random() - .5);
  queue = wrong ? shuf(base) : [...shuf(fresh), ...shuf(rest.filter(q => !prog[q.id][0])), ...shuf(rest.filter(q => prog[q.id][0]))];
  renderSide(); next();
}
function next() {
  curQ = queue.shift();
  const box = $('qbox');
  if (!curQ) { box.innerHTML = '<div class="empty">' + (wrongOnly ? '오답 노트가 비었습니다.' : '이 챕터 문제를 한 바퀴 다 돌았습니다. 다시 고르면 틀린 것부터 나옵니다.') + '</div>'; renderStrip(); return; }
  const q = curQ, c = q.pg.ch;
  const pool = c.pool.filter(a => a !== q.ans).sort((a, b) => Math.abs(a.length - q.ans.length) - Math.abs(b.length - q.ans.length)).slice(0, 12);
  const ctx = ctxLines(q.pg, q.li);
  const choices = [q.ans, ...pool.sort(() => Math.random() - .5).slice(0, 3)].sort(() => Math.random() - .5);
  box.innerHTML = '<div class="meta"><span class="mono">' + esc(q.pg.label) + '</span><span>' + esc(c.title.replace(/^CHAPTER \d+ /, '')) + '</span>'
    + (q.unsure ? '<span class="pill">필기 판독 불확실</span>' : '') + '<button id="viewPg">쪽 보기' + (LEAVES[q.pg.leaf] ? ' · 원본 스캔' : '') + '</button>'
    + '<span class="mono" style="margin-left:auto">' + (prog[q.id] ? (prog[q.id][0] ? '전에 맞힘' : '전에 틀림') : '새 문제') + ' · 남은 ' + queue.length + '</span></div>'
    + '<div class="q">' + (q.sec ? '<span class="sec">' + esc(q.sec) + '</span>' : '') + (ctx.length ? '<span class="ctx">' + ctx.map(t => inline(t)).join('<br>') + '</span>' : '') + inline(q.text, q.ans) + '</div>'
    + '<div class="choices">' + choices.map(ch => '<button data-a="' + esc(ch) + '">' + esc(ch) + '</button>').join('') + '</div><div class="after" id="after"></div>';
  $('viewPg').onclick = () => openPage(q.pg);
  box.querySelectorAll('.choices button').forEach(b => b.onclick = () => answer(q, b, choices));
  renderStrip();
}
function answer(q, btn, choices) {
  const ok = btn.dataset.a === q.ans;
  document.querySelectorAll('.choices button').forEach(b => { b.disabled = true; if (b.dataset.a === q.ans) b.classList.add('ok'); else if (b === btn) b.classList.add('bad'); });
  $('blank').textContent = q.ans;
  save(q.id, ok); renderStats(); renderSide();
  const a = $('after');
  a.innerHTML = '<span class="res" style="color:var(--' + (ok ? 'ok' : 'bad') + ')">' + (ok ? '정답' : '오답 · 정답은 「' + esc(q.ans) + '」') + '</span>'
    + '<button id="explain">AI 해설</button><button class="pri" id="nextBtn">다음 →</button>';
  $('nextBtn').onclick = next; $('nextBtn').focus();
  $('explain').onclick = () => ask('이 문장에서 빈칸의 답이 「' + q.ans + '」인 이유를 교재 내용으로만 짧게 설명해 줘. 보기에 있던 「' + choices.filter(c => c !== q.ans).join('」「') + '」와 어떻게 구별하는지도 알려줘.\n\n문장: ' + q.text.replace(/\*\*/g, ''));
  document.onkeydown = e => { if (e.key === 'Enter' && document.activeElement.tagName !== 'INPUT') next(); };
}
function openPage(pg) {
  $('dlgTxt').innerHTML = '<div class="hd"><b class="mono">' + esc(pg.label) + '</b><span>' + esc(pg.ch ? pg.ch.title : '') + '</span><button id="dlgClose">닫기</button></div>' + pageHtml(pg);
  $('dlgScan').innerHTML = LEAVES[pg.leaf] ? '<div class="hd"><span>원본 스캔 · ' + pg.leaf + '</span></div><img src="' + LEAVES[pg.leaf] + '" alt="' + pg.leaf + ' 스캔">' : '<div class="hd"><span>이 쪽은 원본 스캔이 연결되어 있지 않습니다.</span></div>';
  $('dlgClose').onclick = () => $('dlg').close();
  $('dlg').showModal();
}

// ---------- AI 질문 ----------
let askAI = null, history = [];
initAI().then(fn => { askAI = fn; $('aiHint').textContent = fn ? '답변에는 근거 쪽번호(p.82)가 붙습니다.' : 'AI 연결이 없는 화면입니다. 퀴즈와 쪽 보기는 그대로 됩니다.'; if (!fn) $('ai').hidden = true; });
const stripMd = s => s.replace(/!\[[^\]]*\]\([^)]*\)/g, '').replace(/\*\*/g, '').replace(/<!--.*?-->/g, '').replace(/\n{2,}/g, '\n');
function context(query) {
  const picked = new Set();
  if (curQ) picked.add(curQ.pg);
  const toks = [...new Set(query.replace(/[^가-힣A-Za-z0-9]+/g, ' ').split(' ').filter(t => t.length >= 2))];
  pages.filter(p => p.ch).map(p => ({ p, s: toks.reduce((n, t) => n + (p.lines.some(l => l.t.includes(t)) ? 1 : 0), 0) }))
    .filter(x => x.s).sort((a, b) => b.s - a.s).slice(0, 4).forEach(x => picked.add(x.p));
  return [...picked].map(p => '### ' + p.label + ' (' + (p.ch ? p.ch.title : '') + ')\n' + stripMd(p.lines.map(l => l.t).join('\n')).slice(0, 6000)).join('\n\n');
}
async function ask(text) {
  if (!askAI) return;
  const log = $('log');
  const u = document.createElement('div'); u.className = 'msg u'; u.textContent = text.split('\n\n문장:')[0]; log.appendChild(u);
  const a = document.createElement('div'); a.className = 'msg a'; a.textContent = '생각 중…'; log.appendChild(a); log.scrollTop = log.scrollHeight;
  $('askBtn').disabled = true;
  const sys = '너는 「반가옹 세계사 개념 완성」 교재로 공부하는 학생을 돕는다. 아래 교재 발췌 범위 안에서만 답한다. 발췌에 없는 내용을 물으면 먼저 "교재 밖:"이라고 밝힌 뒤 짧게 답한다. 답에는 근거 쪽번호를 (p.82) 형식으로 붙인다. [필기: ...]는 학생 손글씨, (판독불확실)은 옮겨 적을 때 확실치 않던 부분이니 그 부분을 근거로 삼을 때는 그렇다고 말한다. 한국어로, 5문장 이내.\n\n=== 교재 발췌 ===\n' + context(text) + '\n=== 끝 ===';
  history.push({ role: 'user', content: text });
  const turns = history.slice(-6); if (turns[0].role === 'assistant') turns.shift();
  const msgs = turns.map((m, i) => i === 0 ? { role: 'user', content: sys + '\n\n' + m.content } : m);
  try {
    const r = await askAI(msgs, text => { a.textContent = text; log.scrollTop = log.scrollHeight; });
    a.textContent = r.text; history.push({ role: 'assistant', content: r.text });
  } catch (e) {
    a.textContent = '답변 실패: ' + (e && e.message || e);
    history.pop();
  }
  $('askBtn').disabled = false; log.scrollTop = log.scrollHeight;
}
$('askForm').onsubmit = e => { e.preventDefault(); const v = $('askIn').value.trim(); if (!v) return; $('askIn').value = ''; ask(v); };

$('kWrongBtn').onclick = () => start(cur || chapters[0], true);
renderStats();
let last = 0; try { last = +localStorage.getItem('ch') || 0; } catch {}
start(chapters[last] || chapters[0], false);
</script>
</body></html>
